name: Verify Industry Decision Support

on:
  push:
    branches: [main]
    paths:
      - 'industry_decision_support.py'
      - 'static/js/industry_decision_support.js'
      - 'static/js/industry_detail_viewport_fix.js'
      - 'static/css/industry_decision_support.css'
      - 'management_report_v5_runtime.py'
      - '.github/workflows/verify_industry_decision_support.yml'
  workflow_dispatch:

concurrency:
  group: verify-industry-decision-support
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile industry_decision_support.py management_report_v5_runtime.py
          node --check static/js/industry_decision_support.js
          node --check static/js/industry_detail_viewport_fix.js
          grep -q 'DECISION_SUPPORT_VERSION = "20260827ds3"' management_report_v5_runtime.py
          grep -q 'DECISION_VIEWPORT_FIX_VERSION = "20260827ds4"' management_report_v5_runtime.py
          grep -q 'industry_detail_viewport_fix.js' management_report_v5_runtime.py
          grep -q 'document.body.appendChild(panel)' static/js/industry_detail_viewport_fix.js
          grep -q 'document.body.appendChild(backdrop)' static/js/industry_detail_viewport_fix.js
          grep -q 'pointer-events:none' static/css/industry_decision_support.css

      - name: Wait for exact live assets
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 90); do
            curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --max-time 90 https://sbrate.onrender.com/ >/tmp/root.html || true
            curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --max-time 90 https://sbrate.onrender.com/mobile >/tmp/mobile.html || true
            if grep -q 'industry_decision_support.js?v=20260827ds3' /tmp/root.html \
              && grep -q 'industry_decision_support.css?v=20260827ds3' /tmp/root.html \
              && grep -q 'industry_detail_viewport_fix.js?v=20260827ds4' /tmp/root.html \
              && grep -q 'industry_detail_viewport_fix.js?v=20260827ds4' /tmp/mobile.html; then
              curl -fsS --max-time 90 'https://sbrate.onrender.com/static/js/industry_detail_viewport_fix.js?v=20260827ds4' >/tmp/viewfix.js || true
              if grep -q 'document.body.appendChild(panel)' /tmp/viewfix.js; then
                ready=1; echo DECISION_SUPPORT_VIEWPORT_FIX_LIVE; break
              fi
            fi
            echo "waiting viewport-fix assets $i/90"; sleep 10
          done
          test "$ready" = 1

      - name: API audit including all 79 bank details
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, urllib.parse, urllib.request
          B='https://sbrate.onrender.com'; H={'User-Agent':'SBRate-Decision-Support-Audit/4.0'}
          def js(path, timeout=180):
              req=urllib.request.Request(B+path,headers=H)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  assert r.status==200,(path,r.status); return json.loads(r.read().decode('utf-8'))
          def num(v):
              try:
                  x=float(v); return x if math.isfinite(x) else None
              except: return None
          qs=js('/api/management-report/quarters').get('quarters') or []
          assert len(qs)>=2
          latest,previous=qs[0]['key'],qs[1]['key']
          overview=js('/api/industry-overview?'+urllib.parse.urlencode({'mode':'single','base':latest}))
          assert overview.get('ok') is True
          q=overview.get('quality') or {}; brief=overview.get('brief') or {}
          assert q.get('state') in ('normal','warning','error')
          assert int(q.get('bank_coverage') or 0)>=70 and int(q.get('active_company_count') or 0)>=70
          assert {'fisis','deposit','isa','irp'} <= {x.get('key') for x in q.get('sources') or []}
          assert brief.get('ready') is True and 1<=len(brief.get('items') or [])<=5
          assert any(x.get('key')=='asset_rank' for x in brief.get('items') or [])

          report=js('/api/management-report?'+urllib.parse.urlencode({'base':latest,'compare':previous}))
          rows=report.get('rows') or []; assert len(rows)>=70
          failures=[]
          for row in rows:
              bank=str(row.get('bank') or '').strip()
              if not bank: continue
              try:
                  d=js('/api/industry-bank-detail?'+urllib.parse.urlencode({'bank':bank,'base':latest}),60)
                  assert d.get('ok') is True
                  assert 1<=int(d.get('history_count') or 0)<=8
                  assert len(d.get('fields') or [])==6
                  assert num((d.get('current') or {}).get('total_assets')) is not None
                  assert int(d.get('asset_rank') or 0)>0
              except Exception as exc:
                  failures.append((bank,str(exc)))
          assert not failures,failures[:10]
          cmp=js('/api/industry-overview?'+urllib.parse.urlencode({'mode':'compare','base':latest,'compare':previous}))
          assert (cmp.get('brief') or {}).get('mode')=='compare'
          print('DECISION_SUPPORT_API_OK',{'latest':latest,'banks':len(rows),'quality':q.get('state'),'brief':len(brief.get('items') or [])})
          PY

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: PC and mobile interaction audit
        shell: bash
        run: |
          cat > decision-audit.cjs <<'JS'
          const {chromium}=require('playwright');
          const B='https://sbrate.onrender.com';
          const ok=(c,m)=>{if(!c)throw new Error(m)};
          const collectErrors=p=>{const a=[];p.on('pageerror',e=>a.push(String(e)));return a};
          async function settle(p){await p.waitForLoadState('domcontentloaded');await p.waitForTimeout(4500)}

          async function pc(b){
            const p=await b.newPage({viewport:{width:1920,height:1080}}), errs=collectErrors(p);
            await p.goto(B+'/',{waitUntil:'domcontentloaded',timeout:120000}); await settle(p);
            await p.locator('#management-report-open').click(); await p.waitForSelector('#management-report-modal.is-open',{timeout:15000}); await p.waitForTimeout(2400);
            ok(await p.locator('#ids-quality-badge').isVisible(),'PC trust badge hidden');
            ok(await p.locator('#ids-brief-items .ids-brief-item').count()>=1,'PC brief missing');
            await p.locator('#ids-quality-badge').click(); ok(await p.locator('#ids-quality-panel').isVisible(),'PC trust detail did not open');
            await p.locator('.ids-quality-close').click();
            await p.waitForSelector('#mr-table tbody td.ids-bank-link',{timeout:8000});
            await p.locator('#mr-table tbody td.ids-bank-link').first().click(); await p.waitForSelector('#ids-bank-detail-panel.is-open',{timeout:15000}); await p.waitForTimeout(600);
            ok(await p.locator('#ids-bank-detail-panel').evaluate(e=>e.parentElement===document.body),'PC detail not body anchored');
            ok(await p.locator('#ids-bank-detail-panel .ids-trend-card').count()===6,'PC trends !=6');
            await p.locator('#ids-bank-detail-panel .ids-detail-close').click();
            await p.locator('#mi-section-tabs [data-mi-section="funding"]').click(); await p.waitForTimeout(1700);
            await p.waitForSelector('#mi-content .mi-table tbody td.ids-bank-link',{timeout:8000});
            ok(await p.locator('#mi-content .mi-table tbody td.ids-bank-link').count()>=70,'funding detail links missing');
            await p.locator('#mi-section-tabs [data-mi-section="peer"]').click(); await p.waitForTimeout(1700);
            await p.waitForSelector('#mp-content .mp-table tbody td.ids-bank-link',{timeout:8000});
            ok(await p.locator('#mp-content .mp-table tbody td.ids-bank-link').count()===4,'peer detail links !=4');
            ok(errs.length===0,'PC JS errors '+errs.join(' | '));
            await p.close(); console.log('PC_DECISION_SUPPORT_OK');
          }

          async function mobile(b){
            const p=await b.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true}), errs=collectErrors(p);
            await p.goto(B+'/mobile',{waitUntil:'domcontentloaded',timeout:120000}); await settle(p);
            await p.locator('#management-report-open-mobile').click(); await p.waitForSelector('#management-report-modal.is-open',{timeout:15000}); await p.waitForTimeout(2400);
            const pageDims=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth})); ok(pageDims.sw<=pageDims.cw+2,'mobile overflow '+JSON.stringify(pageDims));
            ok(await p.locator('#ids-quality-badge').isVisible(),'mobile trust badge hidden');
            ok(await p.locator('#ids-brief-items .ids-brief-item').count()>=1,'mobile brief missing');
            const closed=await p.locator('#ids-bank-detail-panel').evaluate(e=>({parent:e.parentElement===document.body,pe:getComputedStyle(e).pointerEvents,vis:getComputedStyle(e).visibility}));
            ok(closed.parent&&closed.pe==='none'&&closed.vis==='hidden','closed mobile sheet state '+JSON.stringify(closed));
            await p.waitForSelector('#mr-table tbody td.ids-bank-link',{timeout:8000});
            await p.locator('#mr-table tbody td.ids-bank-link').first().click(); await p.waitForSelector('#ids-bank-detail-panel.is-open',{timeout:15000}); await p.waitForTimeout(600);
            const geo=await p.locator('#ids-bank-detail-panel').evaluate(e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,b:r.bottom,parent:e.parentElement===document.body}});
            ok(geo.parent&&geo.x>=-1&&geo.w<=392&&geo.y>=80&&geo.b<=846,'mobile sheet geometry '+JSON.stringify(geo));
            ok(await p.locator('#ids-bank-detail-panel .ids-trend-card').count()===6,'mobile trends !=6');
            await p.locator('#ids-bank-detail-backdrop').click({position:{x:10,y:10}}); await p.waitForTimeout(200);
            ok(!(await p.locator('#ids-bank-detail-panel').evaluate(e=>e.classList.contains('is-open'))),'mobile backdrop close failed');
            ok(errs.length===0,'mobile JS errors '+errs.join(' | '));
            await p.close(); console.log('MOBILE_DECISION_SUPPORT_OK');
          }

          (async()=>{const b=await chromium.launch({headless:true});try{await pc(b);await mobile(b);console.log('DECISION_SUPPORT_BROWSER_OK')}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node decision-audit.cjs

      - name: Success
        run: echo INDUSTRY_DECISION_SUPPORT_RELEASE_OK
