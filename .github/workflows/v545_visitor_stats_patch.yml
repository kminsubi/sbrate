name: V5.45 Visitor Stats Patch

# One-shot workflow: this edit intentionally triggers the patch after creation.
on:
  push:
    branches: [main]
    paths:
      - ".github/v545_visitor_stats_patch.py"
      - ".github/workflows/v545_visitor_stats_patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply patch
        run: python .github/v545_visitor_stats_patch.py

      - name: Validate Python
        run: python -m py_compile app.py

      - name: Validate diff
        run: git diff --check

      - name: Commit and self-clean
        run: |
          rm -f .github/v545_visitor_stats_patch.py
          rm -f .github/workflows/v545_visitor_stats_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github
          git diff --cached --check
          git commit -m "Add anonymous dashboard visitor stats"
          git push origin main
