name: SBRate V5.26 Rank Bubble

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v526_rank_bubble.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v526_rank_bubble_patch.py

      - name: Validate
        run: |
          grep -q 'hero-rank-context' templates/mobile.html
          grep -q '시장순위' templates/mobile.html
          grep -q '(최고금리 기준)' templates/mobile.html
          grep -q 'left:112px !important' static/css/v513-mobile-hero-hotfix.css
          grep -q 'top:6px !important' static/css/dashboard.css
          grep -q 'v=20260815v526' templates/mobile.html
          grep -q 'v=20260815v526' templates/index.html
          git diff --check

      - name: Commit and clean
        run: |
          rm -f .github/v526_rank_bubble_patch.py .github/workflows/v526_rank_bubble.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/css/dashboard.css static/css/v513-mobile-hero-hotfix.css templates/index.html templates/mobile.html .github/v526_rank_bubble_patch.py .github/workflows/v526_rank_bubble.yml
          git commit -m 'Add mobile rank context and tune bubble positions'
          git push origin main
