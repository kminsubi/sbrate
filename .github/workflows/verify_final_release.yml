name: Verify SBRate Final Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify_final_release.yml'
      - 'static/js/dashboard_final_guard.js'
      - 'static/js/management_report_mobile_bank_pin.js'
      - 'static/css/management_report_mobile_bank_pin.css'
      - 'static/js/management_report_stability.js'
      - 'static/css/management_report_stability.css'
      - 'static/js/management_report.js'
      - 'static/js/management_intelligence.js'
      - 'static/js/management_report_bank_focus.js'
      - 'management_report_v5_runtime.py'
      - 'management_export_v2.py'
      - 'management_intelligence.py'
      - 'fisis_*.py'
      - 'scheduler.py'
  workflow_dispatch:

concurrency:
  group: verify-sbrate-final-release
  cancel-in-progress: true

jobs:
  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Static release guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile fisis_management.py fisis_intelligence_store.py fisis_profitability_period_patch.py management_intelligence.py management_export_v2.py management_report_auto_update.py management_report_v5_runtime.py scheduler.py
          for f in static/js/dashboard.js static/js/mobile.js static/js/dashboard_final_guard.js static/js/management_report.js static/js/management_intelligence.js static/js/management_report_stability.js static/js/management_report_bank_focus.js static/js/management_report_mobile_bank_pin.js; do node --check "$f"; done
          grep -q 'MOBILE_BANK_PIN_VERSION = "20260826pin1"' management_report_v5_runtime.py
          grep -q 'management_report_mobile_bank_pin.css' management_report_v5_runtime.py
          grep -q 'management_report_mobile_bank_pin.js' management_report_v5_runtime.py
          grep -q 'moveBankFirst' static/js/management_report_mobile_bank_pin.js
          grep -q 'mi-col-bank' static/js/management_report_mobile_bank_pin.js
          grep -q '시장 최저' static/js/dashboard_final_guard.js
          grep -q 'SE017' fisis_profitability_period_patch.py

      - name: Wait for exact final assets
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 90); do
            curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --max-time 90 https://sbrate.onrender.com/ >/tmp/root.html || true
            curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --max-time 90 https://sbrate.onrender.com/mobile >/tmp/mobile.html || true
            if python - <<'PY'
          from pathlib import Path
          r=Path('/tmp/root.html').read_text(encoding='utf-8',errors='ignore')
          m=Path('/tmp/mobile.html').read_text(encoding='utf-8',errors='ignore')
          required=(
              'dashboard_final_guard.js?v=20260826df1',
              'management_report_stability.js?v=20260826mi14',
              'management_report_mobile_bank_pin.js?v=20260826pin1',
              'management_report_mobile_bank_pin.css?v=20260826pin1',
          )
          assert all(x in r and x in m for x in required)
          assert r.count('id="error-report-open"')==1
          assert m.count('id="mobile-error-report"')==1
          assert '데이터 업데이트 기준' in r
          PY
            then ready=1; echo EXACT_FINAL_ASSETS_LIVE; break; fi
            echo "waiting exact final assets $i/90"; sleep 10
          done
          test "$ready" = 1

      - name: Final data API and Excel audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io,json,math,urllib.parse,urllib.request,zipfile,html
          B='https://sbrate.onrender.com'; H={'User-Agent':'SBRate-Release-Audit/1.0'}
          def raw(path,timeout=180):
              req=urllib.request.Request(B+path,headers=H)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  assert r.status==200,(path,r.status); return r.read()
          def js(path):return json.loads(raw(path).decode('utf-8'))
          def items(d):
              if isinstance(d,list):return d
              if isinstance(d,dict):
                  for k in ('products','all_products','items','rates','data','rows'):
                      if isinstance(d.get(k),list):return d[k]
              return []
          def num(v):
              try:x=float(v);return x if math.isfinite(x) else None
              except:return None

          kpi=js('/api/kpi');woori=js('/api/woori');ai=js('/api/ai');top10=items(js('/api/rates?period=12'));products=items(js('/api/products'));isa=items(js('/api/isa?period=12'));irp=items(js('/api/irp?period=12'))
          assert isinstance(kpi,dict) and isinstance(woori,dict)
          assert len(top10)>=10 and len(products)>=70 and len(isa)>0 and len(irp)>0
          assert sum(1 for x in products if isinstance(x,dict) and (num(x.get('rate')) or 0)>0)>=70
          assert (num(woori.get('rate')) or 0)>0 and int(woori.get('market_rank') or 0)>0
          st=' | '.join(map(str,ai.get('summary') or []));
          for x in ('분석상품','평균금리','최고금리','최저금리','금리 스프레드'):assert x in st,x

          qs=js('/api/management-report/quarters').get('quarters') or [];assert len(qs)>=2
          latest,previous=qs[0]['key'],qs[1]['key'];year=int(latest[:4]);qn=int(latest[-1]);assert previous==(f'{year-1}Q4' if qn==1 else f'{year}Q{qn-1}')
          general=js('/api/management-report?'+urllib.parse.urlencode({'base':latest,'compare':previous}));rows=general.get('rows') or [];assert general.get('ok') is True and len(rows)>=70
          names=[str(r.get('bank') or '') for r in rows];assert len(names)==len(set(names));ranks=sorted(int(r['rank']) for r in rows if r.get('rank') is not None);assert ranks==list(range(1,len(ranks)+1));w=next((r for r in rows if '우리금융' in str(r.get('bank') or '')),None);assert w
          intelligence={}
          for section in ('funding','soundness','profitability'):
              d=js('/api/management-intelligence?'+urllib.parse.urlencode({'section':section,'base':latest,'compare':previous}));assert d.get('ok') is True and d.get('ready') is True and len(d.get('rows') or [])>=70 and d.get('woori');intelligence[section]=d
          p=intelligence['profitability'];pm=(p.get('woori') or {}).get('metrics') or {};roa=(pm.get('roa') or {}).get('base');roe=(pm.get('roe') or {}).get('base');assert roa is not None and -100<float(roa)<100;assert roe is not None and -300<float(roe)<300;assert int(p.get('derived_profitability_count') or 0)>=70
          per=p.get('periodicity') or {};assert per.get('quarterly_roa_roe') is True and per.get('official_se010_quarterly_supported') is False
          labels={'general':'종합현황','funding':'수신·조달','soundness':'건전성','profitability':'수익성'}
          for section,label in labels.items():
              for mode in ('single','compare'):
                  q={'section':section,'mode':mode,'base':latest};
                  if mode=='compare':q['compare']=previous
                  z=zipfile.ZipFile(io.BytesIO(raw('/api/management-export.xlsx?'+urllib.parse.urlencode(q))));xml=html.unescape(z.read('xl/worksheets/sheet1.xml').decode('utf-8'));expected=f'{label} 분기현황' if mode=='single' else f'{label} 분기비교';assert expected in xml;(head:=xml.split('</row>',1)[0]);assert ((' vs ' not in head) if mode=='single' else (' vs ' in head))
          assert js('/api/management-report/check-latest').get('ok') is True
          print('FINAL_DATA_OK',{'latest':latest,'previous':previous,'products':len(products),'top10':len(top10),'isa':len(isa),'irp':len(irp),'banks':len(rows),'woori_rank':w.get('rank'),'roa':roa,'roe':roe})
          PY

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Real PC and mobile browser audit
        shell: bash
        run: |
          set -euo pipefail
          cat > final-release-audit.cjs <<'JS'
          const {chromium}=require('playwright');
          const B='https://sbrate.onrender.com',ok=(c,m)=>{if(!c)throw new Error(m)},wait=ms=>new Promise(r=>setTimeout(r,ms));
          const jsErrors=p=>{const a=[];p.on('pageerror',e=>a.push(String(e)));return a};
          async function settle(p){await p.waitForLoadState('domcontentloaded');await p.waitForTimeout(4500)}

          async function pc(b){
            const p=await b.newPage({viewport:{width:1920,height:1080}}),errs=jsErrors(p);await p.goto(B+'/',{waitUntil:'domcontentloaded',timeout:120000});await settle(p);
            let d=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));ok(d.sw<=d.cw+2,'PC horizontal overflow '+JSON.stringify(d));const h=p.locator('body > header');ok(await h.count()===1,'PC header missing');ok(['sticky','fixed'].includes(await h.evaluate(e=>getComputedStyle(e).position)),'PC header not sticky');ok((await p.locator('body').innerText()).includes('데이터 업데이트 기준'),'PC update label missing');const clock=p.locator('#header-current-datetime'),cb=await clock.boundingBox();ok(await clock.isVisible()&&cb&&cb.x+cb.width<=1922,'clock hidden/clipped');await p.evaluate(()=>scrollTo(0,700));await wait(300);const hb=await h.boundingBox();ok(hb&&Math.abs(hb.y)<=2,'PC header scrolls away');await p.evaluate(()=>scrollTo(0,0));
            ok(await p.locator('#management-report-open').count()===1,'PC management duplicate');ok(await p.locator('#error-report-open').count()===1,'PC error duplicate');await p.locator('#management-report-open').click();await p.waitForSelector('#management-report-modal.is-open',{timeout:15000});ok(await p.locator('#mr-export-single').isVisible(),'PC single Excel hidden');ok(await p.locator('#mi-section-tabs [data-mi-section]').count()===4,'PC tabs !=4');
            for(const s of ['general','funding','soundness','profitability']){await p.locator(`#mi-section-tabs [data-mi-section="${s}"]`).click();await wait(1100);if(s==='general')ok(await p.locator('#mr-table tbody tr').count()>=20,'PC general rows');else{ok(await p.locator('#mi-content .mi-table tbody tr').count()>=70,s+' PC rows');ok(await p.locator('#mi-content .mi-bank-focus-btn').count()>=1,s+' Woori focus missing')}}
            await p.locator('#mr-close').click();await wait(400);const labs=(await p.locator('#executive-summary-mini span').allTextContents()).map(x=>x.trim());ok(labs.includes('시장 최저'),'AI market-low missing');const snap=labs.filter(x=>['분석상품','평균금리','금리 스프레드','시장 최고','시장 최저','우리금융'].includes(x));ok(!snap.includes('우리금융'),'AI lower snapshot duplicates Woori');ok(errs.length===0,'PC JS errors '+errs.join(' || '));await p.close();console.log('PC_RELEASE_OK');
          }

          async function mobile(b){
            const p=await b.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true}),errs=jsErrors(p);await p.goto(B+'/mobile',{waitUntil:'domcontentloaded',timeout:120000});await settle(p);let d=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));ok(d.sw<=d.cw+2,'mobile page overflow '+JSON.stringify(d));ok(await p.locator('#management-report-open-mobile').count()===1,'mobile management duplicate');ok(await p.locator('#mobile-error-report').count()===1,'mobile error duplicate');await p.locator('#management-report-open-mobile').click();await p.waitForSelector('#management-report-modal.is-open',{timeout:15000});ok(await p.locator('#mr-export-single').isVisible(),'mobile Excel hidden');await p.locator('#mi-section-tabs [data-mi-section="general"]').click();await wait(1200);
            const firstGeneral=p.locator('#mr-table tbody tr').first();ok(await p.locator('#mr-table tbody tr').count()>=20,'mobile general rows');const bank=firstGeneral.locator('.mr-col-bank');ok(await firstGeneral.locator('td').first().evaluate(e=>e.classList.contains('mr-col-bank')),'general bank is not first column');const bs=await bank.evaluate(e=>({p:getComputedStyle(e).position,w:e.getBoundingClientRect().width,t:e.textContent.trim()}));ok(bs.p==='sticky'&&bs.w<=110&&!bs.t.includes('저축은행'),'general bank style/name '+JSON.stringify(bs));
            const modal=p.locator('#management-report-modal');await modal.evaluate(el=>{const t=document.getElementById('mr-table'),mr=el.getBoundingClientRect(),tr=t.getBoundingClientRect();el.scrollTo(0,Math.max(0,el.scrollTop+tr.top-mr.top+260));});await wait(700);const floating=p.locator('#mr-mobile-column-header');ok(await floating.count()===1&&await floating.isVisible(),'floating header missing');const wrap=p.locator('#mr-table').locator('xpath=ancestor::*[contains(@class,"mr-table-wrap")][1]'),b0=await bank.boundingBox(),metric=firstGeneral.locator('td').nth(4),m0=await metric.boundingBox(),fb=floating.locator('.mr-col-bank'),fb0=await fb.boundingBox();await wrap.evaluate(el=>{el.scrollLeft=Math.min(220,Math.max(0,el.scrollWidth-el.clientWidth));el.dispatchEvent(new Event('scroll'));});await wait(500);const b1=await bank.boundingBox(),m1=await metric.boundingBox(),fb1=await fb.boundingBox();ok(b0&&b1&&Math.abs(b0.x-b1.x)<3,`source bank moved ${b0?.x}->${b1?.x}`);ok(fb0&&fb1&&Math.abs(fb0.x-fb1.x)<3,`header bank moved ${fb0?.x}->${fb1?.x}`);if(m0&&m1)ok(m1.x<m0.x-15,'metric pan failed');
            for(const s of ['funding','soundness','profitability']){await p.locator(`#mi-section-tabs [data-mi-section="${s}"]`).click();await wait(1300);const rs=p.locator('#mi-content .mi-table tbody tr');ok(await rs.count()>=70,s+' rows');const row=rs.first(),bc=row.locator('.mi-col-bank');ok(await row.locator('td').first().evaluate(e=>e.classList.contains('mi-col-bank')),s+' bank not first');const state=await bc.evaluate(e=>({p:getComputedStyle(e).position,w:e.getBoundingClientRect().width,t:e.textContent.trim()}));ok(state.p==='sticky'&&state.w<=110&&!state.t.includes('저축은행'),s+' bank invalid '+JSON.stringify(state));const iw=p.locator('#mi-content .mi-table-wrap').filter({visible:true}).first();}
            ok(errs.length===0,'mobile JS errors '+errs.join(' || '));await p.close();console.log('MOBILE_RELEASE_OK');
          }
          (async()=>{const b=await chromium.launch({headless:true});try{await pc(b);await mobile(b);console.log('FINAL_RELEASE_BROWSER_OK')}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node final-release-audit.cjs

      - name: Release success
        run: echo SBRATE_FINAL_RELEASE_MECE_OK
