name: Verify SBRate Final Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify_final_release.yml'
      - 'static/js/dashboard_final_guard.js'
      - 'static/js/management_report_mobile_bank_pin.js'
      - 'static/css/management_report_mobile_bank_pin.css'
      - 'static/js/management_report_stability.js'
      - 'static/css/management_report_stability.css'
      - 'static/js/management_report.js'
      - 'static/js/management_intelligence.js'
      - 'static/js/management_report_bank_focus.js'
      - 'static/js/management_peer_compare.js'
      - 'static/css/management_peer_compare.css'
      - 'management_peer_compare.py'
      - 'management_report_v5_runtime.py'
      - 'management_export_v2.py'
      - 'management_intelligence.py'
      - 'fisis_*.py'
      - 'scheduler.py'
  workflow_dispatch:

concurrency:
  group: verify-sbrate-final-release
  cancel-in-progress: true

jobs:
  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Static release guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile fisis_management.py fisis_intelligence_store.py fisis_profitability_period_patch.py management_intelligence.py management_peer_compare.py management_export_v2.py management_report_auto_update.py management_report_v5_runtime.py scheduler.py
          for f in static/js/dashboard.js static/js/mobile.js static/js/dashboard_final_guard.js static/js/management_report.js static/js/management_intelligence.js static/js/management_report_stability.js static/js/management_report_bank_focus.js static/js/management_report_mobile_bank_pin.js static/js/management_peer_compare.js; do node --check "$f"; done
          grep -q 'PEER_COMPARE_VERSION = "20260827peer1"' management_report_v5_runtime.py
          grep -q 'management_peer_compare.css' management_report_v5_runtime.py
          grep -q 'management_peer_compare.js' management_report_v5_runtime.py
          grep -q 'MOBILE_BANK_PIN_VERSION = "20260826pin1"' management_report_v5_runtime.py
          grep -q '시장 최저' static/js/dashboard_final_guard.js
          grep -q 'SE017' fisis_profitability_period_patch.py

      - name: Wait for exact release assets
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 90); do
            curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --max-time 90 https://sbrate.onrender.com/ >/tmp/root.html || true
            curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --max-time 90 https://sbrate.onrender.com/mobile >/tmp/mobile.html || true
            if python - <<'PY'
          from pathlib import Path
          r=Path('/tmp/root.html').read_text(encoding='utf-8',errors='ignore')
          m=Path('/tmp/mobile.html').read_text(encoding='utf-8',errors='ignore')
          required=(
              'dashboard_final_guard.js?v=20260826df1',
              'management_report_stability.js?v=20260826mi14',
              'management_report_mobile_bank_pin.js?v=20260826pin1',
              'management_peer_compare.js?v=20260827peer1',
              'management_peer_compare.css?v=20260827peer1',
          )
          assert all(x in r and x in m for x in required)
          assert r.count('id="error-report-open"')==1
          assert m.count('id="mobile-error-report"')==1
          assert '데이터 업데이트 기준' in r
          PY
            then ready=1; echo EXACT_RELEASE_ASSETS_LIVE; break; fi
            echo "waiting exact release assets $i/90"; sleep 10
          done
          test "$ready" = 1

      - name: Final data API and Excel audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io,json,math,urllib.parse,urllib.request,zipfile,html
          B='https://sbrate.onrender.com'; H={'User-Agent':'SBRate-Release-Audit/2.0'}
          def raw(path,timeout=180):
              req=urllib.request.Request(B+path,headers=H)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  assert r.status==200,(path,r.status); return r.read()
          def js(path): return json.loads(raw(path).decode('utf-8'))
          def items(d):
              if isinstance(d,list): return d
              if isinstance(d,dict):
                  for k in ('products','all_products','items','rates','data','rows'):
                      if isinstance(d.get(k),list): return d[k]
              return []
          def num(v):
              try:
                  x=float(v); return x if math.isfinite(x) else None
              except: return None

          kpi=js('/api/kpi'); woori=js('/api/woori'); ai=js('/api/ai')
          top10=items(js('/api/rates?period=12')); products=items(js('/api/products'))
          isa=items(js('/api/isa?period=12')); irp=items(js('/api/irp?period=12'))
          assert isinstance(kpi,dict) and isinstance(woori,dict)
          assert len(top10)>=10 and len(products)>=70 and isa and irp
          assert sum(1 for x in products if isinstance(x,dict) and (num(x.get('rate')) or 0)>0)>=70
          assert (num(woori.get('rate')) or 0)>0 and int(woori.get('market_rank') or 0)>0
          st=' | '.join(map(str,ai.get('summary') or []))
          for token in ('분석상품','평균금리','최고금리','최저금리','금리 스프레드'): assert token in st,token

          qs=js('/api/management-report/quarters').get('quarters') or []; assert len(qs)>=2
          latest,previous=qs[0]['key'],qs[1]['key']; year=int(latest[:4]); qn=int(latest[-1])
          assert previous==(f'{year-1}Q4' if qn==1 else f'{year}Q{qn-1}')
          general=js('/api/management-report?'+urllib.parse.urlencode({'base':latest,'compare':previous})); rows=general.get('rows') or []
          assert general.get('ok') is True and len(rows)>=70
          names=[str(r.get('bank') or '') for r in rows]; assert len(names)==len(set(names))
          ranks=sorted(int(r['rank']) for r in rows if r.get('rank') is not None); assert ranks==list(range(1,len(ranks)+1))
          w=next((r for r in rows if '우리금융' in str(r.get('bank') or '')),None); assert w

          intelligence={}
          for section in ('funding','soundness','profitability'):
              d=js('/api/management-intelligence?'+urllib.parse.urlencode({'section':section,'base':latest,'compare':previous}))
              assert d.get('ok') is True and d.get('ready') is True and len(d.get('rows') or [])>=70 and d.get('woori'); intelligence[section]=d
          p=intelligence['profitability']; pm=(p.get('woori') or {}).get('metrics') or {}
          roa=(pm.get('roa') or {}).get('base'); roe=(pm.get('roe') or {}).get('base')
          assert roa is not None and -100<float(roa)<100
          assert roe is not None and -300<float(roe)<300
          assert int(p.get('derived_profitability_count') or 0)>=70

          peer=js('/api/management-peer?'+urllib.parse.urlencode({'mode':'single','base':latest}))
          assert peer.get('ok') is True and peer.get('ready') is True, peer
          assert peer.get('peer_order')==['woori','shinhan','hana','kb'], peer.get('peer_order')
          assert [x.get('label') for x in peer.get('peers') or []]==['우리금융','신한','하나','KB']
          assert len(peer.get('peers') or [])==4 and not peer.get('missing_peers')
          field_map={x['key']:x for x in peer.get('fields') or []}
          assert field_map['total_assets']['delta_label']=='전년말比'
          assert field_map['deposits']['delta_label']=='전분기比'
          assert field_map['net_income']['delta_label']=='전년동기比'
          assert num(((peer.get('woori') or {}).get('metrics') or {}).get('roa',{}).get('base')) is not None
          assert num(((peer.get('woori') or {}).get('metrics') or {}).get('roe',{}).get('base')) is not None
          peer_cmp=js('/api/management-peer?'+urllib.parse.urlencode({'mode':'compare','base':latest,'compare':previous}))
          assert peer_cmp.get('ok') is True and all(x.get('delta_label')=='비교분기比' for x in peer_cmp.get('fields') or [])

          labels={'general':'종합현황','funding':'수신·조달','soundness':'건전성','profitability':'수익성'}
          for section,label in labels.items():
              for mode in ('single','compare'):
                  q={'section':section,'mode':mode,'base':latest}
                  if mode=='compare': q['compare']=previous
                  z=zipfile.ZipFile(io.BytesIO(raw('/api/management-export.xlsx?'+urllib.parse.urlencode(q))))
                  xml=html.unescape(z.read('xl/worksheets/sheet1.xml').decode('utf-8'))
                  expected=f'{label} 분기현황' if mode=='single' else f'{label} 분기비교'
                  assert expected in xml
                  head=xml.split('</row>',1)[0]
                  assert ((' vs ' not in head) if mode=='single' else (' vs ' in head))

          for mode in ('single','compare'):
              q={'mode':mode,'base':latest}
              if mode=='compare': q['compare']=previous
              z=zipfile.ZipFile(io.BytesIO(raw('/api/management-peer/export.xlsx?'+urllib.parse.urlencode(q))))
              xml=html.unescape(z.read('xl/worksheets/sheet1.xml').decode('utf-8'))
              expected='4대금융 비교 분기현황' if mode=='single' else '4대금융 비교 분기비교'
              assert expected in xml
              positions=[xml.find(x) for x in ('우리금융','신한','하나','KB')]
              assert all(x>=0 for x in positions) and positions==sorted(positions),positions

          assert js('/api/management-report/check-latest').get('ok') is True
          print('FINAL_DATA_PEER_OK',{'latest':latest,'banks':len(rows),'peer_order':peer.get('peer_order'),'woori_peer_ranks':peer.get('woori_peer_ranks'),'roa':roa,'roe':roe})
          PY

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Real PC and mobile browser audit
        shell: bash
        run: |
          set -euo pipefail
          cat > final-release-audit.cjs <<'JS'
          const {chromium}=require('playwright');
          const B='https://sbrate.onrender.com', ok=(c,m)=>{if(!c)throw new Error(m)}, wait=ms=>new Promise(r=>setTimeout(r,ms));
          const jsErrors=p=>{const a=[];p.on('pageerror',e=>a.push(String(e)));return a};
          async function settle(p){await p.waitForLoadState('domcontentloaded');await p.waitForTimeout(4500)}

          async function pc(b){
            const p=await b.newPage({viewport:{width:1920,height:1080}}), errs=jsErrors(p);
            await p.goto(B+'/',{waitUntil:'domcontentloaded',timeout:120000}); await settle(p);
            const dims=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth})); ok(dims.sw<=dims.cw+2,'PC overflow '+JSON.stringify(dims));
            const h=p.locator('body > header'); ok(await h.count()===1,'PC header missing'); ok(['sticky','fixed'].includes(await h.evaluate(e=>getComputedStyle(e).position)),'PC header not sticky');
            ok((await p.locator('body').innerText()).includes('데이터 업데이트 기준'),'PC update basis missing');
            const clock=p.locator('#header-current-datetime'), cb=await clock.boundingBox(); ok(await clock.isVisible()&&cb&&cb.x+cb.width<=1922,'clock hidden/clipped');
            await p.evaluate(()=>scrollTo(0,700)); await wait(250); const hb=await h.boundingBox(); ok(hb&&Math.abs(hb.y)<=2,'PC header scrolls away'); await p.evaluate(()=>scrollTo(0,0));
            ok(await p.locator('#management-report-open').count()===1,'PC management duplicate'); ok(await p.locator('#error-report-open').count()===1,'PC error duplicate');
            await p.locator('#management-report-open').click(); await p.waitForSelector('#management-report-modal.is-open',{timeout:15000});
            ok(await p.locator('#mi-section-tabs [data-mi-section]').count()===5,'PC tabs !=5');
            await p.locator('#mi-section-tabs [data-mi-section="peer"]').click(); await wait(1800);
            ok(await p.locator('#mp-content').isVisible(),'PC peer content hidden'); ok(await p.locator('#mp-export').isVisible(),'PC peer Excel hidden');
            const headers=(await p.locator('.mp-table thead th').allTextContents()).map(x=>x.trim().split('\n')[0]);
            ok(headers[0]==='지표'&&headers[1].startsWith('우리금융')&&headers[2].startsWith('신한')&&headers[3].startsWith('하나')&&headers[4].startsWith('KB'),'PC peer order '+headers.join('|'));
            ok(await p.locator('.mp-summary-card').count()===5,'PC peer summary cards !=5');
            ok(!(await p.locator('#mr-export-single').isVisible()),'standard Excel should hide in peer tab');
            ok(errs.length===0,'PC JS errors '+errs.join(' || ')); await p.close(); console.log('PC_RELEASE_OK');
          }

          async function mobile(b){
            const p=await b.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true}), errs=jsErrors(p);
            await p.goto(B+'/mobile',{waitUntil:'domcontentloaded',timeout:120000}); await settle(p);
            let dims=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth})); ok(dims.sw<=dims.cw+2,'mobile page overflow '+JSON.stringify(dims));
            await p.locator('#management-report-open-mobile').click(); await p.waitForSelector('#management-report-modal.is-open',{timeout:15000});
            ok(await p.locator('#mi-section-tabs [data-mi-section]').count()===5,'mobile tabs !=5');

            await p.locator('#mi-section-tabs [data-mi-section="general"]').click(); await wait(1000);
            const first=p.locator('#mr-table tbody tr').first(), bank=first.locator('.mr-col-bank');
            ok(await first.locator('td').first().evaluate(e=>e.classList.contains('mr-col-bank')),'general bank not first');
            const wrap=p.locator('#mr-table').locator('xpath=ancestor::*[contains(@class,"mr-table-wrap")][1]'), b0=await bank.boundingBox();
            await wrap.evaluate(el=>{el.scrollLeft=Math.min(200,Math.max(0,el.scrollWidth-el.clientWidth));el.dispatchEvent(new Event('scroll'));}); await wait(350); const b1=await bank.boundingBox(); ok(b0&&b1&&Math.abs(b0.x-b1.x)<3,'general bank pin regressed');

            await p.locator('#mi-section-tabs [data-mi-section="peer"]').click(); await wait(1800);
            ok(await p.locator('#mp-content').isVisible(),'mobile peer hidden'); ok(await p.locator('#mp-export').isVisible(),'mobile peer Excel hidden');
            const ph=(await p.locator('.mp-table thead th').allTextContents()).map(x=>x.trim().split('\n')[0]); ok(ph[1].startsWith('우리금융')&&ph[2].startsWith('신한')&&ph[3].startsWith('하나')&&ph[4].startsWith('KB'),'mobile peer order '+ph.join('|'));
            const mw=p.locator('.mp-table-wrap'), metric=p.locator('.mp-table tbody tr').first().locator('.mp-metric-col'), m0=await metric.boundingBox();
            await mw.evaluate(el=>{el.scrollLeft=Math.min(200,Math.max(0,el.scrollWidth-el.clientWidth));el.dispatchEvent(new Event('scroll'));}); await wait(350); const m1=await metric.boundingBox(); ok(m0&&m1&&Math.abs(m0.x-m1.x)<3,'peer metric column moved');
            dims=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth})); ok(dims.sw<=dims.cw+2,'mobile overflow after peer '+JSON.stringify(dims));
            ok(errs.length===0,'mobile JS errors '+errs.join(' || ')); await p.close(); console.log('MOBILE_RELEASE_OK');
          }

          (async()=>{const b=await chromium.launch({headless:true});try{await pc(b);await mobile(b);console.log('FINAL_RELEASE_BROWSER_OK')}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node final-release-audit.cjs

      - name: Release success
        run: echo "SBRate FINAL RELEASE PASS - dashboard, management, peer, Excel, PC, mobile"
