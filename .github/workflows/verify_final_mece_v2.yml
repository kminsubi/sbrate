name: Verify Final MECE V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify_final_mece_v2.yml'
      - 'static/js/dashboard_final_guard.js'
      - 'static/js/dashboard.js'
      - 'static/js/mobile.js'
      - 'static/js/management_*.js'
      - 'static/css/management_*.css'
      - 'management_*.py'
      - 'fisis_*.py'
      - 'scheduler.py'
  workflow_dispatch:

concurrency:
  group: verify-final-mece-v2
  cancel-in-progress: true

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Static code and invariant audit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile fisis_management.py fisis_intelligence_store.py fisis_profitability_period_patch.py management_intelligence.py management_export_v2.py management_report_auto_update.py management_report_v5_runtime.py scheduler.py
          for f in static/js/dashboard.js static/js/mobile.js static/js/dashboard_final_guard.js static/js/management_report.js static/js/management_intelligence.js static/js/management_report_stability.js static/js/management_report_bank_focus.js; do node --check "$f"; done
          grep -q 'DASHBOARD_GUARD_VERSION = "20260826df1"' management_report_v5_runtime.py
          grep -q 'STABILITY_VERSION = "20260826mi14"' management_report_v5_runtime.py
          grep -q '시장 최저' static/js/dashboard_final_guard.js
          grep -q 'mr-mobile-column-header' static/js/management_report_stability.js
          grep -q 'SE017' fisis_profitability_period_patch.py
          grep -q 'annualized_income' fisis_profitability_period_patch.py

      - name: Wait for final assets on Render
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 90); do
            curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --max-time 90 https://sbrate.onrender.com/ >/tmp/root.html || true
            curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --max-time 90 https://sbrate.onrender.com/mobile >/tmp/mobile.html || true
            if python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/root.html').read_text(encoding='utf-8',errors='ignore')
          mobile=Path('/tmp/mobile.html').read_text(encoding='utf-8',errors='ignore')
          req=('dashboard_final_guard.js?v=20260826df1','management_report_stability.js?v=20260826mi14')
          assert all(x in root and x in mobile for x in req)
          assert root.count('id="error-report-open"') == 1
          assert mobile.count('id="mobile-error-report"') == 1
          assert '데이터 업데이트 기준' in root
          PY
            then ready=1; echo FINAL_ASSETS_LIVE; break; fi
            echo "waiting Render $i/90"; sleep 10
          done
          test "$ready" = 1

      - name: API data and Excel MECE audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io,json,math,urllib.parse,urllib.request,zipfile,html
          BASE='https://sbrate.onrender.com'
          H={'User-Agent':'SBRate-Final-MECE-V2/1.0'}
          def raw(path,timeout=180):
              req=urllib.request.Request(BASE+path,headers=H)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  assert r.status==200,(path,r.status)
                  return r.read()
          def js(path): return json.loads(raw(path).decode('utf-8'))
          def items(d):
              if isinstance(d,list): return d
              if isinstance(d,dict):
                  for k in ('products','all_products','items','rates','data','rows'):
                      if isinstance(d.get(k),list): return d[k]
              return []
          def n(v):
              try:
                  x=float(v); return x if math.isfinite(x) else None
              except Exception:return None

          # Dashboard: TOP10 and full products are intentionally separate APIs.
          kpi=js('/api/kpi'); woori=js('/api/woori'); ai=js('/api/ai')
          top10=items(js('/api/rates?period=12'))
          products=items(js('/api/products'))
          isa=items(js('/api/isa?period=12')); irp=items(js('/api/irp?period=12'))
          assert isinstance(kpi,dict) and isinstance(woori,dict)
          assert len(top10)>=10,('top10',len(top10))
          assert len(products)>=70,('products',len(products))
          positive=[n(x.get('rate') if isinstance(x,dict) else None) for x in products]
          positive=[x for x in positive if x is not None and x>0]
          assert len(positive)>=70,('positive product rates',len(positive))
          wr=n(woori.get('rate')); assert wr is not None and wr>0,woori
          assert int(woori.get('market_rank') or 0)>0,woori
          assert len(isa)>0 and len(irp)>0,(len(isa),len(irp))
          summary=ai.get('summary') if isinstance(ai,dict) else None
          assert isinstance(summary,list) and len(summary)>=6,ai
          st=' | '.join(map(str,summary))
          for token in ('분석상품','평균금리','최고금리','최저금리','금리 스프레드'): assert token in st,(token,summary)

          # Management universe and ranking integrity.
          qd=js('/api/management-report/quarters'); qs=qd.get('quarters') or []
          assert len(qs)>=2,qd
          latest,previous=qs[0]['key'],qs[1]['key']
          assert int(qs[0].get('bank_count') or 0)>=70,qs[0]
          q=urllib.parse.urlencode({'base':latest,'compare':previous})
          general=js('/api/management-report?'+q); rows=general.get('rows') or []
          assert general.get('ok') is True and len(rows)>=70,len(rows)
          names=[str(x.get('bank') or '') for x in rows]; assert len(names)==len(set(names)),'duplicate management banks'
          ranks=sorted(int(x['rank']) for x in rows if x.get('rank') is not None)
          assert ranks==list(range(1,len(ranks)+1)),ranks[:10]
          w=next((x for x in rows if '우리금융' in str(x.get('bank') or '')),None); assert w and w.get('rank') is not None

          # Period-benchmark metadata must exist and follow selected quarter logic.
          year=int(latest[:4]); qno=int(latest[-1])
          prevq=f'{year-1}Q4' if qno==1 else f'{year}Q{qno-1}'
          prevye=f'{year-1}Q4'; yoy=f'{year-1}Q{qno}'
          assert previous==prevq,(latest,previous,prevq)
          assert prevye and yoy

          # Intelligence three sections + derived profitability.
          intel={}
          for section in ('funding','soundness','profitability'):
              d=js('/api/management-intelligence?'+urllib.parse.urlencode({'section':section,'base':latest,'compare':previous}))
              assert d.get('ok') is True and d.get('ready') is True,(section,d)
              assert len(d.get('rows') or [])>=70,(section,len(d.get('rows') or []))
              assert d.get('woori'),(section,'Woori missing')
              intel[section]=d
          p=intel['profitability']; pm=(p.get('woori') or {}).get('metrics') or {}
          roa=(pm.get('roa') or {}).get('base'); roe=(pm.get('roe') or {}).get('base')
          assert roa is not None and -100<float(roa)<100,roa
          assert roe is not None and -300<float(roe)<300,roe
          assert int(p.get('derived_profitability_count') or 0)>=70,p.get('derived_profitability_count')
          per=p.get('periodicity') or {}
          assert per.get('quarterly_roa_roe') is True and per.get('official_se010_quarterly_supported') is False,per
          note=(p.get('notes') or {}).get('roa_roe_basis') or ''; assert '산출' in note and '연환산' in note,note

          # Latest-quarter public check remains safe/non-forced.
          lc=js('/api/management-report/check-latest'); assert lc.get('ok') is True,lc

          # 4 sections x single/compare = 8 distinct Excel shapes.
          labels={'general':'종합현황','funding':'수신·조달','soundness':'건전성','profitability':'수익성'}
          for section,label in labels.items():
              for mode in ('single','compare'):
                  params={'section':section,'mode':mode,'base':latest}
                  if mode=='compare':params['compare']=previous
                  b=raw('/api/management-export.xlsx?'+urllib.parse.urlencode(params))
                  z=zipfile.ZipFile(io.BytesIO(b)); assert 'xl/worksheets/sheet1.xml' in z.namelist()
                  xml=html.unescape(z.read('xl/worksheets/sheet1.xml').decode('utf-8'))
                  expected=f'{label} 분기현황' if mode=='single' else f'{label} 분기비교'
                  assert expected in xml,(section,mode,expected)
                  head=xml.split('</row>',1)[0]
                  assert ((' vs ' not in head) if mode=='single' else (' vs ' in head)),(section,mode)
          print('API_DATA_EXCEL_MECE_OK',{'latest':latest,'previous':previous,'products':len(products),'top10':len(top10),'isa':len(isa),'irp':len(irp),'management_banks':len(rows),'woori_rank':w.get('rank'),'roa':roa,'roe':roe})
          PY

      - name: Install Chromium browser audit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Desktop and mobile browser behavior audit
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/audit.js <<'JS'
          const {chromium}=require('playwright');
          const BASE='https://sbrate.onrender.com';
          const ok=(c,m)=>{if(!c)throw new Error(m)};
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          async function settle(page){await page.waitForLoadState('domcontentloaded');await page.waitForTimeout(4000)}

          async function desktop(browser){
            const page=await browser.newPage({viewport:{width:1920,height:1080}}); const errs=[]; page.on('pageerror',e=>errs.push(String(e)));
            await page.goto(BASE+'/',{waitUntil:'domcontentloaded',timeout:120000}); await settle(page);
            let d=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth})); ok(d.sw<=d.cw+2,'desktop horizontal overflow '+JSON.stringify(d));
            const header=page.locator('body > header'); ok(await header.count()===1,'desktop header missing');
            const pos=await header.evaluate(e=>getComputedStyle(e).position); ok(['sticky','fixed'].includes(pos),'desktop header not sticky '+pos);
            ok((await page.locator('body').innerText()).includes('데이터 업데이트 기준'),'update basis missing');
            const clock=page.locator('#header-current-datetime'); ok(await clock.isVisible(),'clock hidden'); const cb=await clock.boundingBox(); ok(cb&&cb.x+cb.width<=1922,'clock clipped '+JSON.stringify(cb));
            await page.evaluate(()=>window.scrollTo(0,700)); await delay(250); const hb=await header.boundingBox(); ok(hb&&Math.abs(hb.y)<=2,'header not fixed after scroll '+JSON.stringify(hb)); await page.evaluate(()=>window.scrollTo(0,0));
            ok(await page.locator('#management-report-open').count()===1,'management button duplicate/missing'); ok(await page.locator('#error-report-open').count()===1,'error button duplicate/missing');
            await page.locator('#management-report-open').click(); await page.waitForSelector('#management-report-modal.is-open',{timeout:15000});
            ok(await page.locator('#mr-export-single').isVisible(),'single Excel hidden'); ok(await page.locator('#mi-section-tabs [data-mi-section]').count()===4,'section tabs !=4');
            for(const s of ['general','funding','soundness','profitability']){
              await page.locator(`#mi-section-tabs [data-mi-section="${s}"]`).click(); await page.waitForTimeout(1000);
              if(s==='general') ok(await page.locator('#mr-table tbody tr').count()>=20,'general visible rows too few');
              else {ok(await page.locator('#mi-content .mi-table tbody tr').count()>=70,s+' rows too few'); ok(await page.locator('#mi-content .mi-bank-focus-btn').count()>=1,s+' Woori focus missing');}
            }
            await page.locator('#mr-close').click(); await delay(350);
            const labels=(await page.locator('#executive-summary-mini span').allTextContents()).map(x=>x.trim());
            ok(labels.includes('시장 최저'),'market low missing '+labels.join('|')); const snapshot=labels.filter(x=>['분석상품','평균금리','금리 스프레드','시장 최고','시장 최저','우리금융'].includes(x)); ok(!snapshot.includes('우리금융'),'duplicated Woori in snapshot '+snapshot.join('|'));
            ok(errs.length===0,'desktop JS errors '+errs.join(' || ')); await page.close(); console.log('DESKTOP_BROWSER_OK');
          }

          async function mobile(browser){
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true}); const errs=[]; page.on('pageerror',e=>errs.push(String(e)));
            await page.goto(BASE+'/mobile',{waitUntil:'domcontentloaded',timeout:120000}); await settle(page);
            let d=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth})); ok(d.sw<=d.cw+2,'mobile page horizontal overflow '+JSON.stringify(d));
            ok(await page.locator('#management-report-open-mobile').count()===1,'mobile management duplicate/missing'); ok(await page.locator('#mobile-error-report').count()===1,'mobile error duplicate/missing');
            await page.locator('#management-report-open-mobile').click(); await page.waitForSelector('#management-report-modal.is-open',{timeout:15000}); ok(await page.locator('#mr-export-single').isVisible(),'mobile Excel hidden');
            await page.locator('#mi-section-tabs [data-mi-section="general"]').click(); await page.waitForTimeout(1000); ok(await page.locator('#mr-table tbody tr').count()>=20,'mobile general rows too few');
            const bank=page.locator('#mr-table tbody .mr-col-bank').first(); const bs=await bank.evaluate(e=>({p:getComputedStyle(e).position,w:e.getBoundingClientRect().width,t:e.textContent.trim()})); ok(bs.p==='sticky','general bank not sticky '+JSON.stringify(bs)); ok(bs.w<=110,'general bank too wide '+bs.w); ok(!bs.t.includes('저축은행'),'general suffix remains '+bs.t);
            const modal=page.locator('#management-report-modal');
            await modal.evaluate(el=>{const t=document.getElementById('mr-table');const mr=el.getBoundingClientRect(),tr=t.getBoundingClientRect();el.scrollTo(0,Math.max(0,el.scrollTop+tr.top-mr.top+260));}); await delay(600);
            const float=page.locator('#mr-mobile-column-header'); ok(await float.count()===1,'floating header not created'); ok(await float.isVisible(),'floating header not visible');
            const wrap=page.locator('#mr-table').locator('xpath=ancestor::*[contains(@class,"mr-table-wrap")][1]'); const b0=await bank.boundingBox(); const metric=page.locator('#mr-table tbody tr').first().locator('td').nth(4); const m0=await metric.boundingBox();
            await wrap.evaluate(el=>{el.scrollLeft=Math.min(220,Math.max(0,el.scrollWidth-el.clientWidth));el.dispatchEvent(new Event('scroll'));}); await delay(350); const b1=await bank.boundingBox(),m1=await metric.boundingBox(); ok(b0&&b1&&Math.abs(b0.x-b1.x)<3,'bank moved horizontally'); if(m0&&m1)ok(m1.x<m0.x-15,'metrics did not pan');
            for(const s of ['funding','soundness','profitability']){
              await page.locator(`#mi-section-tabs [data-mi-section="${s}"]`).click(); await page.waitForTimeout(1100); const rows=page.locator('#mi-content .mi-table tbody tr'); ok(await rows.count()>=70,s+' mobile rows too few'); const c=rows.first().locator('td').nth(1); const txt=(await c.textContent()||'').trim(); ok(!txt.includes('저축은행'),s+' suffix remains '+txt); ok((await c.evaluate(e=>getComputedStyle(e).position))==='sticky',s+' bank not sticky');
            }
            ok(errs.length===0,'mobile JS errors '+errs.join(' || ')); await page.close(); console.log('MOBILE_BROWSER_OK');
          }
          (async()=>{const b=await chromium.launch({headless:true});try{await desktop(b);await mobile(b);console.log('FINAL_BROWSER_MECE_OK')}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/audit.js

      - name: Final success marker
        run: echo FINAL_SBRate_DESKTOP_MOBILE_DATA_MECE_OK
