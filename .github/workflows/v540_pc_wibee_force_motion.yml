name: SBRate V5.40 PC Wibee Force Motion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v540_pc_wibee_force_motion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v540_pc_wibee_force_motion.py

      - name: Validate
        shell: bash
        run: |
          grep -q 'SBRate V5.40 PC WIBEE FORCE MOTION' static/css/dashboard.css
          grep -q 'dashboard.css?v=20260818v540' templates/index.html
          grep -q 'wibee-pc-stage::before' static/css/dashboard.css
          git diff --check

      - name: Commit and clean
        shell: bash
        run: |
          rm -f .github/v540_pc_wibee_force_motion.py
          rm -f .github/workflows/v540_pc_wibee_force_motion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/css/dashboard.css templates/index.html .github/v540_pc_wibee_force_motion.py .github/workflows/v540_pc_wibee_force_motion.yml
          git commit -m 'Keep PC Wibee motion active on reduced-motion PCs'
          git push origin main
