name: SBRate V5.36 Brief + Rate Cue

on:
  push:
    paths:
      - '.github/workflows/v536_brief_ratecue.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v536_brief_ratecue_patch.py

      - name: Validate
        run: |
          python -m py_compile app.py
          python -m py_compile .github/v536_brief_ratecue_patch.py
          git diff --check
          grep -q '이상 수신 업권현황 브리핑을 마칩니다.' app.py
          grep -q 'SBRate V5.36 MOBILE RATE CUE PER PRODUCT' static/css/v513-mobile-hero-hotfix.css
          grep -q 'sb-v536-rate-cue-deposit' static/css/v513-mobile-hero-hotfix.css
          grep -q 'sb-v536-rate-cue-isa' static/css/v513-mobile-hero-hotfix.css
          grep -q 'sb-v536-rate-cue-irp' static/css/v513-mobile-hero-hotfix.css
          grep -q 'v513-mobile-hero-hotfix.css?v=20260815v536' templates/mobile.html
          grep -q '<strong>V2.6</strong>' templates/mobile.html

      - name: Commit and clean
        run: |
          rm -f .github/v536_brief_ratecue_patch.py .github/workflows/v536_brief_ratecue.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish Telegram closing and replay mobile rate cue' || exit 0
          git push origin main
