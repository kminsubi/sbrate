name: Verify Management UI Stability

on:
  push:
    branches: [main]
    paths:
      - 'static/js/management_report_stability.js'
      - 'static/css/management_report_stability.css'
      - 'management_report_v5_runtime.py'
      - '.github/workflows/verify_management_ui_stability.yml'
  workflow_dispatch:

concurrency:
  group: verify-management-ui-stability
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static UI guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile management_report_v5_runtime.py
          node --check static/js/management_report_stability.js
          grep -q 'STABILITY_VERSION = "20260826mi9"' management_report_v5_runtime.py
          grep -q "parent.insertBefore(management, error)" static/js/management_report_stability.js
          grep -q "mr-export-single" static/js/management_report_stability.js
          grep -q "mr-scroll-stable" static/js/management_report_stability.js
          grep -q "overflow-y:auto!important" static/css/management_report_stability.css
          grep -q "overflow-y:visible!important" static/css/management_report_stability.css
          grep -q "mr-single-export-btn" static/css/management_report_stability.css

      - name: Wait for live stability assets
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 90); do
            curl -fsS --max-time 90 'https://sbrate.onrender.com/' >/tmp/root.html || true
            curl -fsS --max-time 90 'https://sbrate.onrender.com/mobile' >/tmp/mobile.html || true
            if python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/root.html').read_text(encoding='utf-8',errors='ignore')
          mobile=Path('/tmp/mobile.html').read_text(encoding='utf-8',errors='ignore')
          version='20260826mi9'
          required=[
              f'management_report_stability.css?v={version}',
              f'management_report_stability.js?v={version}',
          ]
          ok=all(item in root and item in mobile for item in required)
          raise SystemExit(0 if ok else 1)
          PY
            then
              ready=1
              break
            fi
            echo "waiting for Render UI stability deploy... $i/90"
            sleep 10
          done
          test "$ready" = 1

      - name: Verify singleton assets and source buttons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/root.html').read_text(encoding='utf-8',errors='ignore')
          mobile=Path('/tmp/mobile.html').read_text(encoding='utf-8',errors='ignore')
          version='20260826mi9'
          for html,name in [(root,'root'),(mobile,'mobile')]:
              assert html.count(f'management_report_stability.css?v={version}') == 1, name
              assert html.count(f'management_report_stability.js?v={version}') == 1, name
              assert html.count('data-sbrate-management-report="1"') == 2, name
          assert root.count('id="error-report-open"') == 1, root.count('id="error-report-open"')
          assert mobile.count('id="mobile-error-report"') == 1, mobile.count('id="mobile-error-report"')
          print('HTML_SINGLETONS_OK')
          PY

      - name: Verify live stability JS CSS and Excel endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 90 'https://sbrate.onrender.com/static/js/management_report_stability.js?v=20260826mi9' >/tmp/stability.js
          curl -fsS --max-time 90 'https://sbrate.onrender.com/static/css/management_report_stability.css?v=20260826mi9' >/tmp/stability.css
          node --check /tmp/stability.js
          grep -q "parent.insertBefore(management, error)" /tmp/stability.js
          grep -q "mr-export-single" /tmp/stability.js
          grep -q "mr-scroll-stable" /tmp/stability.js
          grep -q "overflow-y:visible!important" /tmp/stability.css
          curl -fsS --max-time 120 'https://sbrate.onrender.com/api/management-report/export.xlsx' -o /tmp/report.xlsx
          python - <<'PY'
          import zipfile
          assert zipfile.is_zipfile('/tmp/report.xlsx')
          with zipfile.ZipFile('/tmp/report.xlsx') as z:
              assert 'xl/workbook.xml' in z.namelist()
          print('UI_STABILITY_LIVE_OK')
          PY
