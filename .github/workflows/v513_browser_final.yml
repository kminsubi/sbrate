name: SBRate V5.13 Final Browser Validation
# final browser validation revision 3

on:
  push:
    branches:
      - agent/v513-professional-polish
    paths:
      - .github/workflows/v513_browser_final.yml
  workflow_dispatch:

jobs:
  browser-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v513-professional-polish

      - name: Prepare headless browser
        shell: bash
        run: |
          set -e
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --no-save puppeteer-core@24

      - name: Serve dashboard static shell
        shell: bash
        run: |
          rm -rf .layout-test
          mkdir -p .layout-test
          cp templates/index.html .layout-test/index.html
          cp templates/mobile.html .layout-test/mobile.html
          cp -R static .layout-test/static
          python -m http.server 8123 --directory .layout-test >/tmp/sbrate-layout-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8123/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Validate PC 1700/1366 and mobile 360/390/430
        run: node .github/v513_layout_validate.js
