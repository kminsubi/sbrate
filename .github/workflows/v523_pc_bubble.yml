name: SBRate V5.23 PC Wibee Bubble

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v523_pc_bubble.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v523_pc_bubble_patch.py

      - name: Validate
        run: |
          grep -q 'SBRate V5.23 PC WIBEE BUBBLE FINE TUNE' static/css/dashboard.css
          grep -q 'left:-4px !important' static/css/dashboard.css
          grep -q 'top:2px !important' static/css/dashboard.css
          grep -q 'dashboard.css?v=20260815v523' templates/index.html
          git diff --check

      - name: Commit and clean
        run: |
          rm -f .github/v523_pc_bubble_patch.py .github/workflows/v523_pc_bubble.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/css/dashboard.css templates/index.html .github/v523_pc_bubble_patch.py .github/workflows/v523_pc_bubble.yml
          git commit -m 'Fine tune PC Wibee bubble right and down'
          git push origin main
