name: FISIS Management Auto Check

on:
  schedule:
    # KST 07:10 / 19:10
    - cron: '10 22 * * *'
    - cron: '10 10 * * *'
  workflow_dispatch:

jobs:
  check-latest-quarter:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render
        run: |
          curl -fsS --retry 4 --retry-delay 5 --max-time 90 \
            https://sbrate.onrender.com/ >/dev/null

      - name: Check FISIS latest quarter
        run: |
          curl -fsS --retry 3 --retry-delay 8 --max-time 600 \
            https://sbrate.onrender.com/api/management-report/check-latest \
            | python -m json.tool
