name: SBRateBot Daily Auto Update

on:
  schedule:
    # GitHub cron is UTC.
    # 15:30 UTC = 00:30 KST (next day)
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sbratebot-daily-update
  cancel-in-progress: false

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 beautifulsoup4 selenium

      - name: Update fixed deposit rates
        id: deposit
        continue-on-error: true
        run: |
          python crawler/fsb.py

      - name: Update ISA and IRP rates
        id: pension
        continue-on-error: true
        run: |
          python crawler/pension_rates.py

      - name: Show collector results
        if: always()
        run: |
          echo "Fixed deposit: ${{ steps.deposit.outcome }}"
          echo "ISA/IRP      : ${{ steps.pension.outcome }}"

      - name: Save daily history snapshot
        if: always() && steps.deposit.outcome == 'success' && steps.pension.outcome == 'success'
        run: |
          python crawler/snapshot_history.py

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in             data/latest_rates.json             data/previous_rates.json             data/update_info.json             data/banks.json             data/isa_rates.json             data/irp_rates.json             data/pension_sources.json             data/history/*.json
          do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if [ -d "data/history" ]; then
            git add data/history/*.json 2>/dev/null || true
          fi

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Auto update deposit ISA IRP rates"
            git push
          fi

      - name: Fail if a collector failed
        if: always() && (steps.deposit.outcome != 'success' || steps.pension.outcome != 'success')
        run: |
          echo "One or more collectors failed."
          echo "Fixed deposit: ${{ steps.deposit.outcome }}"
          echo "ISA/IRP      : ${{ steps.pension.outcome }}"
          exit 1
