name: One Shot Korea Investment Wiring

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one_shot_koreainvest_entry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply wiring patch
        run: python .github/patch_koreainvest_entry.py

      - name: Validate workflow replacements
        run: |
          grep -n "python crawler/pension_entry.py" .github/workflows/rate_update.yml
          grep -n "python crawler/pension_retry_entry.py" .github/workflows/rate_update.yml
          if grep -q "python crawler/pension_rates.py" .github/workflows/rate_update.yml; then exit 1; fi
          if grep -q "python crawler/pension_retry_failed.py" .github/workflows/rate_update.yml; then exit 1; fi
          git diff --check

      - name: Remove one-shot patch artifacts
        run: |
          rm -f .github/patch_koreainvest_entry.py
          rm -f .github/workflows/one_shot_koreainvest_entry.yml

      - name: Commit wiring patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire resilient Korea Investment pension collector"
          git push origin main
