name: SBRate V5.41 PC Wibee Priority Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch_v541_pc_wibee_priority.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply V5.41 patch
        run: python .github/patch_v541_pc_wibee_priority.py

      - name: Validate
        run: |
          grep -q "SBRate V5.41 PC WIBEE REDUCED-MOTION PRIORITY FIX" static/css/dashboard.css
          grep -q "dashboard.css?v=20260818v541" templates/index.html
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PC Wibee reduced-motion priority"
          git push origin main
