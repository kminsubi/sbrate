name: SBRate V5.39 PC Wibee Fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v539_pc_wibee_fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v539_pc_wibee_fallback.py

      - name: Validate
        shell: bash
        run: |
          grep -q 'wibee-pc-stage' templates/index.html
          grep -q 'SBRate V5.39 PC WIBEE LEGACY FALLBACK' static/css/dashboard.css
          grep -q 'dashboard.css?v=20260818v539' templates/index.html
          git diff --check

      - name: Commit and clean
        shell: bash
        run: |
          rm -f .github/v539_pc_wibee_fallback.py .github/workflows/v539_pc_wibee_fallback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/index.html static/css/dashboard.css .github/v539_pc_wibee_fallback.py .github/workflows/v539_pc_wibee_fallback.yml
          git commit -m 'Add PC Wibee legacy browser fallback'
          git push origin main
