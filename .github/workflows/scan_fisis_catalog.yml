name: Scan FISIS Savings Bank Catalog

on:
  push:
    paths:
      - '.github/workflows/scan_fisis_catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Render catalog endpoint
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS --max-time 60 'https://sbrate.onrender.com/api/management-report/fisis-catalog?accounts=0' >/tmp/catalog-lite.json; then
              if python - <<'PY'
          import json, sys
          try:
              d=json.load(open('/tmp/catalog-lite.json',encoding='utf-8'))
          except Exception:
              sys.exit(1)
          sys.exit(0 if d.get('ok') and d.get('table_count',0) > 0 and int(d.get('probe_version') or 0) >= 2 else 1)
          PY
              then
                echo 'FISIS catalog endpoint v2 is live'
                exit 0
              fi
            fi
            echo "waiting for Render... $i/60"
            sleep 10
          done
          exit 1

      - name: Scan table and account metadata
        run: |
          set -e
          curl -fsS --max-time 600 \
            'https://sbrate.onrender.com/api/management-report/fisis-catalog?accounts=1&account_limit=80' \
            > data/fisis_catalog_scan.json
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('data/fisis_catalog_scan.json')
          d=json.loads(path.read_text(encoding='utf-8'))
          assert d.get('ok') is True, d
          assert int(d.get('probe_version') or 0) >= 2, d
          assert d.get('table_count',0) > 0, d

          def pick(row,*keys):
              for key in keys:
                  value=row.get(key)
                  if value not in (None,''):
                      return str(value)
              return ''

          summary={
              'ok': True,
              'probe_version': d.get('probe_version'),
              'source': d.get('source'),
              'sector': d.get('sector'),
              'table_count': d.get('table_count'),
              'interesting_table_count': d.get('interesting_table_count'),
              'category_errors': d.get('category_errors') or [],
              'account_errors': d.get('account_errors') or [],
              'interesting_tables': [],
          }
          accounts=d.get('accounts') or {}
          for row in d.get('interesting_tables') or []:
              no=pick(row,'list_no','listNo','list_cd','listCd')
              name=pick(row,'list_nm','listName','list_name','listNm')
              account_rows=accounts.get(no) or []
              compact_accounts=[]
              for a in account_rows:
                  cd=pick(a,'account_cd','accountCd','account_code')
                  nm=pick(a,'account_nm','accountName','account_name','accountNm')
                  if cd or nm:
                      compact_accounts.append({'account_cd':cd,'account_nm':nm})
              summary['interesting_tables'].append({
                  'list_no': no,
                  'list_nm': name,
                  'sml_div': row.get('_sml_div'),
                  'account_count': len(compact_accounts),
                  'accounts': compact_accounts,
              })

          Path('data/fisis_catalog_summary.json').write_text(
              json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8'
          )
          print(json.dumps({
              'table_count': summary['table_count'],
              'interesting_table_count': summary['interesting_table_count'],
              'interesting_names': [x['list_nm'] for x in summary['interesting_tables']],
              'category_error_count': len(summary['category_errors']),
              'account_error_count': len(summary['account_errors']),
          },ensure_ascii=False,indent=2))
          PY

      - name: Commit safe catalog results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/fisis_catalog_scan.json data/fisis_catalog_summary.json
          if git diff --cached --quiet; then
            echo 'No catalog changes'
          else
            git commit -m 'Capture FISIS savings-bank catalog metadata'
            git push
          fi
