name: Verify Management V5

on:
  push:
    paths:
      - 'static/js/management_report_v5_patch.js'
      - 'static/css/management_report_v5_patch.css'
      - 'management_report_v5_runtime.py'
      - 'management_report_auto_update.py'
      - 'fisis_region_patch.py'
      - 'scheduler.py'
      - '.github/workflows/verify_management_v5.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          python -m py_compile scheduler.py fisis_region_patch.py management_report_auto_update.py management_report_v5_runtime.py
          node --check static/js/management_report_v5_patch.js

      - name: Wait for Render V5 deployment
        run: |
          set -e
          for i in $(seq 1 45); do
            html="$(curl -fsS --max-time 90 https://sbrate.onrender.com/ || true)"
            if echo "$html" | grep -q 'management_report_v5_patch.js' && echo "$html" | grep -q 'management_report_v5_patch.css'; then
              echo 'V5 assets are live'
              exit 0
            fi
            echo "waiting for Render... $i/45"
            sleep 10
          done
          echo 'V5 assets not live in time'
          exit 1

      - name: Verify region source and latest-quarter checker
        run: |
          set -e
          echo '--- region diagnostic ---'
          curl -fsS --max-time 120 https://sbrate.onrender.com/api/management-report/region-diagnostic | tee /tmp/region.json | python -m json.tool
          python - <<'PY'
          import json
          d=json.load(open('/tmp/region.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('company_count',0) >= 50, d
          assert (d.get('woori') or {}).get('bank') == '우리금융저축은행', d
          PY

          echo '--- latest-quarter check ---'
          curl -fsS --max-time 600 https://sbrate.onrender.com/api/management-report/check-latest | tee /tmp/latest.json | python -m json.tool
          python - <<'PY'
          import json
          d=json.load(open('/tmp/latest.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('current_latest'), d
          assert d.get('target_quarter'), d
          PY
