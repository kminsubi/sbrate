name: Verify Management V5

on:
  push:
    paths:
      - 'static/js/management_report_v5_patch.js'
      - 'static/css/management_report_v5_patch.css'
      - 'management_report_v5_runtime.py'
      - 'management_report_auto_update.py'
      - 'fisis_region_patch.py'
      - 'fisis_quality_patch.py'
      - 'scheduler.py'
      - '.github/workflows/verify_management_v5.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          python -m py_compile scheduler.py fisis_region_patch.py fisis_quality_patch.py management_report_auto_update.py management_report_v5_runtime.py
          node --check static/js/management_report_v5_patch.js
          node --check static/js/management_intelligence.js
          node --check static/js/management_intelligence_polish.js

      - name: Wait for current Render deployment
        run: |
          set -e
          for i in $(seq 1 80); do
            html="$(curl -fsS --max-time 90 https://sbrate.onrender.com/ || true)"
            region="$(curl -fsS --max-time 90 https://sbrate.onrender.com/api/management-report/region-diagnostic || true)"
            printf '%s' "$region" > /tmp/region.json
            if echo "$html" | grep -q '20260826v7' \
              && echo "$html" | grep -q '20260826mi4' \
              && python - <<'PY'
          import json, sys
          try:
              d=json.load(open('/tmp/region.json',encoding='utf-8'))
          except Exception:
              sys.exit(1)
          w=d.get('woori') or {}
          sys.exit(0 if d.get('region_source') == '저축은행중앙회 전국 저축은행 현황' and w.get('region') == '충청' else 1)
          PY
            then
              echo 'Current V5 + management intelligence deployment is live'
              exit 0
            fi
            echo "waiting for current Render deploy... $i/80"
            sleep 10
          done
          echo 'Current V5 deployment not live in time'
          exit 1

      - name: Verify region source
        run: |
          set -e
          echo '--- region diagnostic ---'
          cat /tmp/region.json | python -m json.tool
          python - <<'PY'
          import json
          d=json.load(open('/tmp/region.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('company_count',0) >= 50, d
          assert d.get('region_count',0) >= 70, d
          assert d.get('region_source') == '저축은행중앙회 전국 저축은행 현황', d
          w=d.get('woori') or {}
          assert w.get('bank') == '우리금융저축은행', d
          assert w.get('region') == '충청', d
          PY

      - name: Run and persist latest-quarter publication probe
        run: |
          set -e
          echo '--- latest-quarter check start ---'
          curl -fsS --max-time 90 https://sbrate.onrender.com/api/management-report/check-latest > /tmp/latest-start.json
          cat /tmp/latest-start.json | python -m json.tool

          python - <<'PY'
          import json
          d=json.load(open('/tmp/latest-start.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('current_latest'), d
          assert d.get('target_quarter'), d
          assert float(d.get('coverage_ratio_required',0)) >= 0.90, d
          PY

          start_status="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/latest-start.json',encoding='utf-8')).get('status') or '')
          PY
          )"

          if [ "$start_status" = "probe_started" ] || [ "$start_status" = "probe_running" ]; then
            echo 'Waiting for shared Upstash probe result...'
            for i in $(seq 1 90); do
              curl -fsS --max-time 90 https://sbrate.onrender.com/api/management-report/check-latest/status > /tmp/latest-status.json || true
              if python - <<'PY'
          import json, sys
          try:
              d=json.load(open('/tmp/latest-status.json',encoding='utf-8'))
          except Exception:
              sys.exit(1)
          final_status=str(d.get('status') or '')
          done=(
              d.get('persistent') is True and
              bool(d.get('finished_at')) and
              final_status in {
                  'new_quarter_not_broadly_published',
                  'new_quarter_refresh_started',
                  'refresh_already_running',
                  'latest_quarter_no_new_banks',
                  'probe_failed',
              }
          )
          sys.exit(0 if done else 1)
          PY
              then
                echo 'Persistent latest-quarter probe finished'
                break
              fi
              echo "waiting for publication probe... $i/90"
              sleep 10
            done
          else
            cp /tmp/latest-start.json /tmp/latest-status.json
          fi

          echo '--- latest-quarter final state ---'
          cat /tmp/latest-status.json | python -m json.tool
          python - <<'PY'
          import json
          d=json.load(open('/tmp/latest-status.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          status=d.get('status')
          allowed={
              'latest_already_loaded',
              'waiting_for_disclosure_window',
              'management_refresh_running',
              'recent_probe_reused',
              'new_quarter_not_broadly_published',
              'new_quarter_refresh_started',
              'refresh_already_running',
              'latest_quarter_no_new_banks',
          }
          assert status in allowed, d
          if d.get('probe_required'):
              assert d.get('company_count', d.get('active_company_count',0)) >= 70, d
              if d.get('published_asset_count') is not None:
                  assert int(d.get('published_asset_count') or 0) <= int(d.get('company_count') or 999), d
          print('LATEST_QUARTER_PROBE', {
              'status':status,
              'target':d.get('target_quarter'),
              'current_latest':d.get('current_latest'),
              'published_asset_count':d.get('published_asset_count'),
              'coverage_threshold':d.get('coverage_threshold'),
              'stored_asset_count':d.get('stored_asset_count'),
              'triggered_refresh':d.get('triggered_refresh'),
              'finished_at':d.get('finished_at'),
              'persistent':d.get('persistent'),
          })
          PY
