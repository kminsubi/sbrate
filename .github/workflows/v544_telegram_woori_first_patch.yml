name: V5.44 Telegram Woori First Patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v544_telegram_woori_first_patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Telegram briefing order patch
        run: python .github/v544_telegram_woori_first_patch.py

      - name: Validate Python and diff
        run: |
          python -m py_compile app.py
          git diff --check

      - name: Remove one-shot patch files
        run: |
          rm -f .github/v544_telegram_woori_first_patch.py
          rm -f .github/workflows/v544_telegram_woori_first_patch.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show Woori first in Telegram brief sections"
          git push origin main
