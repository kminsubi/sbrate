name: SBRate V5.29 Mobile Product Period

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v529_mobile_product_period.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v529_mobile_product_period_patch.py

      - name: Validate
        run: |
          grep -q 'id="mobile-product-period"' templates/mobile.html
          grep -q 'productPeriod: "12"' static/js/mobile.js
          grep -q 'SBRate V5.29 MOBILE PRODUCT PERIOD' static/css/mobile.css
          grep -q 'mobile.js?v=20260815v529' templates/mobile.html
          git diff --check

      - name: Commit and clean
        run: |
          rm -f .github/v529_mobile_product_period_patch.py .github/workflows/v529_mobile_product_period.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/mobile.html static/js/mobile.js static/css/mobile.css .github/v529_mobile_product_period_patch.py .github/workflows/v529_mobile_product_period.yml
          git commit -m 'Add mobile product period selector'
          git push origin main
