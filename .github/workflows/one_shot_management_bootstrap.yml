name: One Shot Management Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one_shot_management_bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sbrate-management-bootstrap-debug
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfplumber

      - name: Run collector and capture diagnostics
        shell: bash
        run: |
          set +e
          python crawler/management_quarterly.py --limit 12 > .github/management_bootstrap_result.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> .github/management_bootstrap_result.txt
          if [ -f data/management/quarters.json ]; then
            echo "DATA_FILE=YES" >> .github/management_bootstrap_result.txt
            python - <<'PY' >> .github/management_bootstrap_result.txt 2>&1
import json
from pathlib import Path
p=Path('data/management/quarters.json')
data=json.loads(p.read_text(encoding='utf-8'))
qs=data.get('quarters',{})
print('QUARTERS=', sorted(qs.keys(), reverse=True))
for key in sorted(qs.keys(), reverse=True)[:3]:
    q=qs[key]
    print(key, 'banks=', len(q.get('banks',[])), 'source_type=', q.get('source_type'))
PY
          else
            echo "DATA_FILE=NO" >> .github/management_bootstrap_result.txt
          fi
          exit 0

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/one_shot_management_bootstrap.yml

      - name: Commit result and collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/management_bootstrap_result.txt
          if [ -f data/management/quarters.json ]; then
            git add -f data/management/quarters.json
          fi
          git add -u .github/workflows/one_shot_management_bootstrap.yml
          git commit -m "Capture management report bootstrap result"
          git push origin main
