name: Fix Management MECE Runner

on:
  push:
    paths:
      - '.github/workflows/fix_management_mece_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct strict match count
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply_management_mece_audit.yml')
          s=p.read_text(encoding='utf-8')
          old="replace('management_report_v4_runtime.py','20260825v4','20260826v8',expected=4)"
          new="replace('management_report_v4_runtime.py','20260825v4','20260826v8',expected=3)"
          if s.count(old) != 1:
              raise SystemExit(f'expected one runner count marker, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git diff --check
      - name: Commit runner correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply_management_mece_audit.yml
          git commit -m 'Fix MECE patch strict match count'
          git pull --rebase origin main
          git push origin main
