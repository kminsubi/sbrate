name: SBRate V5.32 Product Period Scope

on:
  push:
    paths:
      - '.github/workflows/v532_period_scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v532_period_scope_patch.py

      - name: Validate
        run: |
          python -m py_compile .github/v532_period_scope_patch.py
          git diff --check
          grep -q 'SBRate V5.32 PRODUCT PERIOD AVAILABILITY' static/js/dashboard.js
          grep -q 'SBRate V5.32 MOBILE PRODUCT PERIOD AVAILABILITY' static/js/mobile.js
          grep -q 'dashboard.js?v=20260815v532' templates/index.html
          grep -q 'mobile.js?v=20260815v532' templates/mobile.html

      - name: Commit and clean
        run: |
          rm -f .github/v532_period_scope_patch.py .github/workflows/v532_period_scope.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Limit one month period to deposits' || exit 0
          git push origin main
