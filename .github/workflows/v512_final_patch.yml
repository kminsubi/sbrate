name: SBRate V5.12 Final Patch

on:
  push:
    branches:
      - chatgpt-v512-final-20260815
    paths:
      - tools/apply_v512_final_patch.py
      - .github/workflows/v512_final_patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-v512-final-20260815

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply patch
        run: python tools/apply_v512_final_patch.py

      - name: Python syntax check
        run: python -m py_compile app.py

      - name: JavaScript syntax check
        run: |
          node --check static/js/mobile.js
          node --check static/js/dashboard.js

      - name: Diff sanity check
        run: git diff --check

      - name: Commit patched files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add app.py templates/index.html templates/mobile.html static/css/dashboard.css static/js/mobile.js
          git commit -m "Apply SBRate V5.12 final UX patch" || echo "No patch changes"
          git push origin HEAD:chatgpt-v512-final-20260815
