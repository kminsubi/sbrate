name: Verify Management V4

on:
  push:
    paths:
      - 'static/js/management_report.js'
      - 'static/css/management_report_v4.css'
      - 'management_report_v4_runtime.py'
      - 'fisis_history_patch.py'
      - 'scheduler.py'
      - '.github/workflows/verify_management_v4.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python -m py_compile scheduler.py management_report_v4_runtime.py fisis_history_patch.py
      - name: Check JavaScript syntax
        run: node --check static/js/management_report.js
      - name: Check requested management wiring
        run: |
          grep -q "mode: 'single'" static/js/management_report.js
          grep -q "전년말比" static/js/management_report.js
          grep -q "전분기比" static/js/management_report.js
          grep -q "202001" fisis_history_patch.py
          grep -q "management_report_v4.css" management_report_v4_runtime.py
      - name: Wait for Render V4 deployment
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "https://sbrate.onrender.com/"
          last = ""
          for attempt in range(60):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"SBRate-V4-Verify/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      html = response.read().decode("utf-8", "ignore")
                  ok_js = "management_report.js?v=20260826v8" in html
                  ok_css = "management_report_v4.css?v=20260826v8" in html
                  if ok_js and ok_css:
                      print("LIVE_V4_ASSETS_OK")
                      raise SystemExit(0)
                  last = f"js={ok_js} css={ok_css}"
              except Exception as exc:
                  last = f"{type(exc).__name__}: {exc}"
              print(f"waiting {attempt+1}/60: {last}")
              time.sleep(10)
          raise SystemExit(f"Render V4 asset check timed out: {last}")
          PY
