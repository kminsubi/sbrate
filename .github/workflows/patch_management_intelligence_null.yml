name: Patch Management Intelligence Null Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_management_intelligence_null.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch null numeric formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/js/management_intelligence.js')
          s=p.read_text(encoding='utf-8')
          old="""  function num(value) {\n    const n = Number(value);\n    return Number.isFinite(n) ? n : null;\n  }\n"""
          new="""  function num(value) {\n    if (value === null || value === undefined || value === '') return null;\n    const n = Number(value);\n    return Number.isFinite(n) ? n : null;\n  }\n"""
          if old not in s:
              if new in s:
                  print('null guard already applied')
              else:
                  raise SystemExit('target num() block not found')
          else:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check static/js/management_intelligence.js
          grep -q "value === null || value === undefined || value === ''" static/js/management_intelligence.js

      - name: Commit null guard
        run: |
          if git diff --quiet; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/management_intelligence.js
          git commit -m 'Prevent null management metrics rendering as zero'
          git pull --rebase origin main
          git push origin main
