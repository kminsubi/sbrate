name: Verify Management Intelligence

on:
  push:
    paths:
      - 'fisis_intelligence_store.py'
      - 'fisis_profitability_period_patch.py'
      - 'management_intelligence.py'
      - 'management_export_v2.py'
      - 'management_report_v5_runtime.py'
      - 'static/js/management_intelligence.js'
      - 'static/js/management_intelligence_polish.js'
      - 'static/css/management_intelligence.css'
      - 'scheduler.py'
      - '.github/workflows/verify_management_intelligence.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static syntax checks
        run: |
          python -m py_compile \
            fisis_intelligence_store.py \
            fisis_profitability_period_patch.py \
            management_intelligence.py \
            management_export_v2.py \
            management_report_v5_runtime.py \
            scheduler.py
          node --check static/js/management_intelligence.js
          node --check static/js/management_intelligence_polish.js
          grep -q 'SE017' fisis_profitability_period_patch.py
          grep -q 'bs_equity' fisis_profitability_period_patch.py
          grep -q 'annualized_income' fisis_profitability_period_patch.py

      - name: Wait for Render derived-profitability deployment
        run: |
          set -e
          for i in $(seq 1 90); do
            if curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --max-time 90 'https://sbrate.onrender.com/api/management-report/intelligence-status' >/tmp/status.json; then
              if python - <<'PY'
          import json, sys
          try:
              d=json.load(open('/tmp/status.json',encoding='utf-8'))
          except Exception:
              sys.exit(1)
          ok=(d.get('ok') is True and int(d.get('code_schema_version') or 0) >= 8)
          sys.exit(0 if ok else 1)
          PY
              then
                echo 'Derived profitability deployment is live'
                cat /tmp/status.json
                exit 0
              fi
            fi
            echo "waiting for Render deploy... $i/90"
            sleep 10
          done
          echo 'Derived profitability deployment did not become live in time'
          cat /tmp/status.json 2>/dev/null || true
          exit 1

      - name: Wait for SE017 equity cache migration
        run: |
          set -e
          for i in $(seq 1 70); do
            curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --max-time 90 'https://sbrate.onrender.com/api/management-report/intelligence-status' >/tmp/status.json || true
            if python - <<'PY'
          import json, sys
          try:
              d=json.load(open('/tmp/status.json',encoding='utf-8'))
          except Exception:
              sys.exit(1)
          coverage=d.get('coverage') or {}
          ok=(
              d.get('ok') is True and d.get('ready') is True and
              int(d.get('schema_version') or 0) >= 8 and
              int(d.get('quarter_count') or 0) >= 6 and
              int(d.get('bank_count') or 0) >= 70 and
              d.get('woori_available') is True and
              int(coverage.get('deposits') or 0) >= 70 and
              int(coverage.get('liquidity_ratio') or 0) >= 70 and
              int(coverage.get('operating_profit') or 0) >= 70 and
              int(coverage.get('interest_expense') or 0) >= 70 and
              int(coverage.get('deposit_interest_expense') or 0) >= 70 and
              int(coverage.get('time_deposit_interest_expense') or 0) >= 70 and
              int(coverage.get('bs_equity') or 0) >= 70
          )
          sys.exit(0 if ok else 1)
          PY
            then
              echo 'SE017 equity cache migration is ready'
              cat /tmp/status.json
              exit 0
            fi
            echo "waiting for SE017 cache migration... $i/70"
            if [ $((i % 5)) -eq 0 ]; then cat /tmp/status.json 2>/dev/null || true; fi
            sleep 10
          done
          echo 'SE017 equity cache migration was not ready in time'
          cat /tmp/status.json 2>/dev/null || true
          exit 1

      - name: Verify stable base report is unchanged
        run: |
          curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --max-time 90 'https://sbrate.onrender.com/api/management-report/quarters' >/tmp/quarters.json
          python - <<'PY' >/tmp/qparams.env
          import json
          d=json.load(open('/tmp/quarters.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          qs=d.get('quarters') or []
          assert len(qs) >= 2, d
          assert int(qs[0].get('bank_count') or 0) >= 70, qs[0]
          print('LATEST='+qs[0]['key'])
          print('PREVIOUS='+qs[1]['key'])
          PY
          . /tmp/qparams.env
          curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --max-time 90 "https://sbrate.onrender.com/api/management-report?base=${LATEST}&compare=${PREVIOUS}" >/tmp/base-report.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/base-report.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          rows=d.get('rows') or []
          assert len(rows) >= 70, len(rows)
          w=next((x for x in rows if '우리금융' in str(x.get('bank') or '')),None)
          assert w, 'Woori missing from base report'
          assert w.get('rank') is not None, w
          print('stable_base', {'rows':len(rows),'woori_rank':w.get('rank'),'woori_compare_rank':w.get('compare_rank')})
          PY

      - name: Verify live intelligence payloads and derived ratios
        run: |
          set -e
          . /tmp/qparams.env
          for section in funding soundness profitability; do
            curl --retry 4 --retry-all-errors --retry-delay 2 -fsS --max-time 90 "https://sbrate.onrender.com/api/management-intelligence?section=${section}&base=${LATEST}&compare=${PREVIOUS}" >"/tmp/${section}.json"
          done
          python - <<'PY'
          import json
          def load(name): return json.load(open(f'/tmp/{name}.json',encoding='utf-8'))
          def val(d,key): return (((d.get('woori') or {}).get('metrics') or {}).get(key) or {}).get('base')
          def reasonable_amount(value, name):
              assert value is not None, f'{name} missing'
              assert abs(float(value)) < 1_000_000, f'{name} looks like raw KRW, not 억원: {value}'
          f,s,p=load('funding'),load('soundness'),load('profitability')
          for name,d in [('funding',f),('soundness',s),('profitability',p)]:
              assert d.get('ok') is True, (name,d)
              assert d.get('ready') is True, (name,d)
              assert int(d.get('intelligence_schema_version') or 0) >= 8, (name,d)
              assert int(d.get('intelligence_quarter_count') or 0) >= 6, (name,d)
              assert len(d.get('rows') or []) >= 70, (name,len(d.get('rows') or []))
          reasonable_amount(val(f,'deposits'),'deposits')
          reasonable_amount(val(f,'time_deposits'),'time_deposits')
          assert val(s,'liquidity_ratio') is not None, s
          assert val(s,'delinquency_ratio') is not None, s
          for key in ('net_income','operating_profit','net_interest_income','interest_income','interest_expense','deposit_interest_expense','time_deposit_interest_expense'):
              reasonable_amount(val(p,key),key)

          roa=val(p,'roa'); roe=val(p,'roe')
          assert roa is not None and -100 < float(roa) < 100, ('derived ROA invalid',roa)
          assert roe is not None and -300 < float(roe) < 300, ('derived ROE invalid',roe)
          assert int(p.get('derived_profitability_count') or 0) >= 70, p.get('derived_profitability_count')
          periodicity=p.get('periodicity') or {}
          assert periodicity.get('quarterly_roa_roe') is True, periodicity
          assert 'derived' in str(periodicity.get('roa_roe_source') or '').lower(), periodicity
          note=(p.get('notes') or {}).get('roa_roe_basis') or ''
          assert '산출' in note and '전년말' in note and '연환산' in note, note
          print('INTELLIGENCE_PAYLOADS_OK', {'roa':roa,'roe':roe,'derived_count':p.get('derived_profitability_count')})
          PY

          curl --retry 4 --retry-all-errors --retry-delay 2 -fsS --max-time 90 'https://sbrate.onrender.com/api/management-intelligence/insight' >/tmp/insight.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/insight.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('ready') is True, d
          assert d.get('latest'), d
          print('INSIGHT_OK', {'latest':d.get('latest'),'latest_label':d.get('latest_label'),'as_of':d.get('as_of')})
          PY
