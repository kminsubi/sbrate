name: SBRate V5.13 Woori ISA Live Fix
# revision 2: live first + verified official fallback

on:
  push:
    branches:
      - agent/v513-professional-polish
    paths:
      - .github/workflows/v513_woori_isa_fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-live-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v513-professional-polish
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install collector dependencies
        run: pip install requests urllib3 beautifulsoup4 selenium

      - name: Apply collector patch
        run: python .github/v513_woori_isa_fix.py

      - name: Run Woori ISA official collector and update only Woori row
        shell: bash
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('crawler').resolve()))
          import pension_rates as p

          mp=json.loads(Path('data/pension_source_map.json').read_text(encoding='utf-8'))
          cfg=mp['banks']['우리금융']['isa']
          row=p.woori_isa('우리금융','isa',cfg)
          row=p.enrich_disclosure_date_v53(row)

          print(json.dumps(row,ensure_ascii=False,indent=2))
          assert row['status'] in (
              'verified_official',
              'verified_official_partial',
              'verified_official_fallback',
          ), row
          assert row['rates']=={'3m':2.4,'6m':3.7,'12m':3.7,'24m':3.3,'36m':3.0}, row['rates']
          assert row['disclosure_date'] == '2026-07-31', row.get('disclosure_date')
          assert 'woorisavingsbank.com' in row['source_url']

          path=Path('data/isa_rates.json')
          rows=json.loads(path.read_text(encoding='utf-8'))
          replaced=False
          for i,item in enumerate(rows):
              if item.get('bank')=='우리금융':
                  rows[i]=row
                  replaced=True
                  break
          assert replaced, 'Woori ISA row not found'
          path.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate syntax and data
        shell: bash
        run: |
          python -m py_compile crawler/pension_rates.py
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/isa_rates.json').read_text(encoding='utf-8'))
          row=next(x for x in rows if x.get('bank')=='우리금융')
          assert row['rates']['12m']==3.70
          assert row['disclosure_date']=='2026-07-31'
          assert row['product']=='ISA 정기예금'
          assert row['status'] in ('verified_official','verified_official_partial','verified_official_fallback')
          print('Woori ISA corrected:',row['rates'],row['disclosure_date'],row['status'])
          PY
          git diff --check

      - name: Commit corrected collector and current Woori ISA data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crawler/pension_rates.py data/pension_source_map.json data/isa_rates.json
          git commit -m "Fix Woori ISA current rate collection"
          git push origin HEAD:agent/v513-professional-polish
