name: SBRate V5.31 Add 1M Period

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v531_add_1m_period.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v531_add_1m_period.py

      - name: Validate
        run: |
          grep -q '<option value="1">1개월</option>' templates/index.html
          grep -q '<option value="1">1개월</option>' templates/mobile.html
          grep -q '<strong>V2.3</strong>' templates/mobile.html
          git diff --check

      - name: Commit and clean
        run: |
          rm -f .github/v531_add_1m_period.py .github/workflows/v531_add_1m_period.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/index.html templates/mobile.html .github/v531_add_1m_period.py .github/workflows/v531_add_1m_period.yml
          git commit -m 'Add one month period to product explorer'
          git push origin main
