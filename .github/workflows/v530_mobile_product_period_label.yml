name: SBRate V5.30 Mobile Product Period Label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v530_mobile_product_period_label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v530_mobile_product_period_label_patch.py

      - name: Validate
        run: |
          grep -q 'MobileState.productPeriod || MobileState.period' static/js/mobile.js
          grep -q 'mobile.js?v=20260815v530' templates/mobile.html
          git diff --check

      - name: Commit and clean
        run: |
          rm -f .github/v530_mobile_product_period_label_patch.py .github/workflows/v530_mobile_product_period_label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/mobile.js templates/mobile.html .github/v530_mobile_product_period_label_patch.py .github/workflows/v530_mobile_product_period_label.yml
          git commit -m 'Fix mobile product row period label'
          git push origin main
