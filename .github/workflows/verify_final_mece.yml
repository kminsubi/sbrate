name: Verify Final MECE

on:
  push:
    branches: [main]
    paths:
      - 'static/js/dashboard_final_guard.js'
      - 'static/js/dashboard.js'
      - 'static/js/mobile.js'
      - 'static/js/management_*.js'
      - 'static/css/management_*.css'
      - 'management_*.py'
      - 'fisis_*.py'
      - 'scheduler.py'
      - '.github/workflows/verify_final_mece.yml'
  workflow_dispatch:

concurrency:
  group: verify-final-mece
  cancel-in-progress: true

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Static syntax and invariant guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            fisis_management.py fisis_intelligence_store.py fisis_profitability_period_patch.py \
            management_intelligence.py management_export_v2.py management_report_auto_update.py \
            management_report_v5_runtime.py scheduler.py
          node --check static/js/dashboard.js
          node --check static/js/mobile.js
          node --check static/js/dashboard_final_guard.js
          node --check static/js/management_report.js
          node --check static/js/management_intelligence.js
          node --check static/js/management_report_stability.js
          grep -q 'DASHBOARD_GUARD_VERSION = "20260826df1"' management_report_v5_runtime.py
          grep -q 'STABILITY_VERSION = "20260826mi14"' management_report_v5_runtime.py
          grep -q "시장 최저" static/js/dashboard_final_guard.js
          grep -q "mr-mobile-column-header" static/js/management_report_stability.js
          grep -q "annualized_income" fisis_profitability_period_patch.py
          grep -q "SE017" fisis_profitability_period_patch.py

      - name: Wait for audited Render deployment
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 90); do
            curl --retry 2 --retry-all-errors --retry-delay 2 -fsS --max-time 90 https://sbrate.onrender.com/ >/tmp/root.html || true
            curl --retry 2 --retry-all-errors --retry-delay 2 -fsS --max-time 90 https://sbrate.onrender.com/mobile >/tmp/mobile.html || true
            if python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/root.html').read_text(encoding='utf-8',errors='ignore')
          mobile=Path('/tmp/mobile.html').read_text(encoding='utf-8',errors='ignore')
          required=('dashboard_final_guard.js?v=20260826df1','management_report_stability.js?v=20260826mi14')
          ok=all(x in root and x in mobile for x in required)
          raise SystemExit(0 if ok else 1)
          PY
            then
              ready=1
              echo "AUDITED_RENDER_DEPLOYMENT_LIVE"
              break
            fi
            echo "waiting for audited deploy $i/90"
            sleep 10
          done
          test "$ready" = 1

      - name: API and data MECE audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, urllib.request, urllib.parse, zipfile, io
          BASE='https://sbrate.onrender.com'

          def get_json(path, timeout=120):
              req=urllib.request.Request(BASE+path, headers={'User-Agent':'SBRate-Final-Audit/1.0'})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  assert r.status == 200, (path, r.status)
                  return json.loads(r.read().decode('utf-8'))

          def as_items(d):
              if isinstance(d,list): return d
              if isinstance(d,dict):
                  for key in ('items','rates','data','rows'):
                      if isinstance(d.get(key),list): return d[key]
              return []

          def num(v):
              try:
                  n=float(v)
                  return n if math.isfinite(n) else None
              except Exception:
                  return None

          # A. Main dashboard APIs
          kpi=get_json('/api/kpi')
          woori=get_json('/api/woori')
          rates=as_items(get_json('/api/rates?period=12'))
          ai=get_json('/api/ai')
          isa=as_items(get_json('/api/isa?period=12'))
          irp=as_items(get_json('/api/irp?period=12'))
          assert isinstance(kpi,dict) and isinstance(woori,dict)
          assert len(rates) >= 70, len(rates)
          positive=[num(x.get('rate')) for x in rates if isinstance(x,dict)]
          positive=[x for x in positive if x is not None and x>0]
          assert len(positive) >= 70, len(positive)
          assert num(woori.get('rate')) and num(woori.get('rate')) > 0, woori
          assert int(woori.get('market_rank') or 0) > 0, woori
          assert isa, 'ISA empty'
          assert irp, 'IRP empty'
          summary=ai.get('summary') if isinstance(ai,dict) else None
          assert isinstance(summary,list) and len(summary)>=6, ai
          summary_text=' | '.join(map(str,summary))
          for token in ('분석상품','평균금리','최고금리','최저금리','금리 스프레드'):
              assert token in summary_text, (token, summary)

          # B. Management quarter universe and period logic
          qd=get_json('/api/management-report/quarters')
          qs=qd.get('quarters') or []
          assert len(qs)>=2, qd
          latest, previous=qs[0]['key'], qs[1]['key']
          assert int(qs[0].get('bank_count') or 0) >= 70, qs[0]
          base=get_json('/api/management-report?'+urllib.parse.urlencode({'base':latest,'compare':previous}))
          rows=base.get('rows') or []
          assert base.get('ok') is True and len(rows)>=70, len(rows)
          banks=[str(x.get('bank') or '') for x in rows]
          assert len(banks)==len(set(banks)), 'duplicate banks'
          w=next((x for x in rows if '우리금융' in str(x.get('bank') or '')),None)
          assert w and w.get('rank') is not None, 'Woori missing'
          ranks=sorted(int(x['rank']) for x in rows if x.get('rank') is not None)
          assert ranks == list(range(1,len(ranks)+1)), ranks[:10]

          # C. Funding / soundness / profitability
          intelligence={}
          for section in ('funding','soundness','profitability'):
              d=get_json('/api/management-intelligence?'+urllib.parse.urlencode({'section':section,'base':latest,'compare':previous}))
              assert d.get('ok') is True and d.get('ready') is True, (section,d)
              assert len(d.get('rows') or [])>=70, (section,len(d.get('rows') or []))
              assert d.get('woori'), (section,'Woori missing')
              intelligence[section]=d
          p=intelligence['profitability']
          pm=(p.get('woori') or {}).get('metrics') or {}
          roa=((pm.get('roa') or {}).get('base'))
          roe=((pm.get('roe') or {}).get('base'))
          assert roa is not None and -100 < float(roa) < 100, roa
          assert roe is not None and -300 < float(roe) < 300, roe
          assert int(p.get('derived_profitability_count') or 0)>=70, p.get('derived_profitability_count')
          periodicity=p.get('periodicity') or {}
          assert periodicity.get('quarterly_roa_roe') is True, periodicity
          assert periodicity.get('official_se010_quarterly_supported') is False, periodicity

          # D. Latest-quarter watcher must be non-forced from public endpoint
          latest_check=get_json('/api/management-report/check-latest')
          assert latest_check.get('ok') is True, latest_check

          # E. Eight Excel views
          labels={'general':'종합현황','funding':'수신·조달','soundness':'건전성','profitability':'수익성'}
          for section,label in labels.items():
              for mode in ('single','compare'):
                  params={'section':section,'mode':mode,'base':latest}
                  if mode=='compare': params['compare']=previous
                  url=BASE+'/api/management-export.xlsx?'+urllib.parse.urlencode(params)
                  req=urllib.request.Request(url, headers={'User-Agent':'SBRate-Final-Audit/1.0'})
                  with urllib.request.urlopen(req,timeout=180) as r:
                      raw=r.read()
                  z=zipfile.ZipFile(io.BytesIO(raw))
                  assert 'xl/worksheets/sheet1.xml' in z.namelist(), (section,mode)
                  xml=z.read('xl/worksheets/sheet1.xml').decode('utf-8')
                  expected=f'{label} 분기현황' if mode=='single' else f'{label} 분기비교'
                  assert expected in xml, (section,mode,expected)
                  if mode=='single': assert ' vs ' not in xml.split('</row>',1)[0]
                  else: assert ' vs ' in xml.split('</row>',1)[0]

          print('API_DATA_MECE_OK', {
              'latest':latest,'previous':previous,'management_banks':len(rows),
              'deposit_rows':len(rates),'isa_rows':len(isa),'irp_rows':len(irp),
              'woori_rank':w.get('rank'),'roa':roa,'roe':roe,
          })
          PY

      - name: Install browser audit runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Desktop and mobile browser MECE audit
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/final-browser-audit.js <<'JS'
          const { chromium } = require('playwright');
          const BASE='https://sbrate.onrender.com';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          function check(cond,msg){ if(!cond) throw new Error(msg); }

          async function waitDashboard(page){
            await page.waitForLoadState('domcontentloaded');
            await page.waitForTimeout(3500);
          }

          async function desktop(browser){
            const page=await browser.newPage({viewport:{width:1920,height:1080},deviceScaleFactor:1});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto(BASE+'/',{waitUntil:'domcontentloaded',timeout:120000});
            await waitDashboard(page);

            const dims=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            check(dims.sw<=dims.cw+2,`desktop horizontal overflow ${JSON.stringify(dims)}`);
            check(await page.locator('body > header').count()===1,'desktop header missing');
            const headerPos=await page.locator('body > header').evaluate(el=>getComputedStyle(el).position);
            check(headerPos==='sticky' || headerPos==='fixed',`desktop header not sticky: ${headerPos}`);
            check((await page.locator('body').innerText()).includes('데이터 업데이트 기준'),'desktop update basis label missing');
            const clock=page.locator('#header-current-datetime');
            check(await clock.isVisible(),'desktop clock hidden');
            const cb=await clock.boundingBox();
            check(cb && cb.x+cb.width<=1922,`desktop clock clipped ${JSON.stringify(cb)}`);
            await page.evaluate(()=>window.scrollTo(0,700)); await sleep(250);
            const hb=await page.locator('body > header').boundingBox();
            check(hb && Math.abs(hb.y)<=2,`desktop header moved with page ${JSON.stringify(hb)}`);
            await page.evaluate(()=>window.scrollTo(0,0));

            const mg=page.locator('#management-report-open');
            check(await mg.count()===1 && await mg.isVisible(),'desktop management button missing');
            check(await page.locator('#error-report-open').count()===1,'desktop error button duplicate/missing');
            await mg.click();
            await page.waitForSelector('#management-report-modal.is-open',{timeout:15000});
            check(await page.locator('#mr-export-single').isVisible(),'single Excel button hidden');
            check(await page.locator('#mi-section-tabs [data-mi-section]').count()===4,'management section count != 4');

            for(const section of ['general','funding','soundness','profitability']){
              await page.locator(`#mi-section-tabs [data-mi-section="${section}"]`).click();
              await page.waitForTimeout(800);
              if(section==='general'){
                check(await page.locator('#mr-table tbody tr').count()>=70,'general table row shortage');
              }else{
                check(await page.locator('#mi-content .mi-table tbody tr').count()>=70,`${section} table row shortage`);
                check(await page.locator('#mi-content .mi-bank-focus-btn').count()>=1,`${section} Woori focus missing`);
              }
            }

            // Deposit AI market snapshot should be MECE: market low, not duplicated Woori.
            await page.locator('#management-report-modal .mr-close').click().catch(()=>{});
            await page.waitForTimeout(300);
            const aiLabels=await page.locator('#executive-summary-mini span').allTextContents();
            check(aiLabels.map(x=>x.trim()).includes('시장 최저'),`AI market low missing: ${aiLabels.join('|')}`);
            const marketLabels=aiLabels.map(x=>x.trim()).filter(x=>['분석상품','평균금리','금리 스프레드','시장 최고','시장 최저','우리금융'].includes(x));
            check(!marketLabels.includes('우리금융'),`AI market snapshot still duplicates Woori: ${marketLabels.join('|')}`);
            check(pageErrors.length===0,`desktop page errors: ${pageErrors.join(' || ')}`);
            await page.close();
            console.log('DESKTOP_BROWSER_OK');
          }

          async function mobile(browser){
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto(BASE+'/mobile',{waitUntil:'domcontentloaded',timeout:120000});
            await waitDashboard(page);
            const dims=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            check(dims.sw<=dims.cw+2,`mobile page horizontal overflow ${JSON.stringify(dims)}`);

            const mg=page.locator('#management-report-open-mobile');
            check(await mg.count()===1 && await mg.isVisible(),'mobile management button missing');
            check(await page.locator('#mobile-error-report').count()===1,'mobile error button duplicate/missing');
            await mg.click();
            await page.waitForSelector('#management-report-modal.is-open',{timeout:15000});
            check(await page.locator('#mr-export-single').isVisible(),'mobile single Excel hidden');
            await page.locator('#mi-section-tabs [data-mi-section="general"]').click();
            await page.waitForTimeout(900);
            check(await page.locator('#mr-table tbody tr').count()>=70,'mobile general row shortage');

            const bank=page.locator('#mr-table tbody .mr-col-bank').first();
            const bankStyle=await bank.evaluate(el=>({position:getComputedStyle(el).position,width:el.getBoundingClientRect().width,text:el.textContent.trim()}));
            check(bankStyle.position==='sticky',`mobile bank column not sticky: ${JSON.stringify(bankStyle)}`);
            check(bankStyle.width<=110,`mobile bank column too wide: ${bankStyle.width}`);
            check(!bankStyle.text.includes('저축은행'),`mobile bank suffix not removed: ${bankStyle.text}`);

            // Scroll the report vertically into the table; floating column header must appear.
            const modal=page.locator('#management-report-modal');
            const tableY=await page.locator('#mr-table').evaluate(el=>el.offsetTop);
            await modal.evaluate((el,y)=>el.scrollTo(0,Math.max(0,y+260)),tableY);
            await page.waitForTimeout(500);
            const floating=page.locator('#mr-mobile-column-header');
            check(await floating.count()===1,'mobile floating header not created');
            check(await floating.isVisible(),'mobile floating header not visible while table is in view');

            // Horizontal pan: bank column stays fixed while metrics move.
            const wrap=page.locator('#mr-table').locator('xpath=ancestor::*[contains(@class,"mr-table-wrap")][1]');
            const bankBefore=await bank.boundingBox();
            const metric=page.locator('#mr-table tbody tr').first().locator('td').nth(4);
            const metricBefore=await metric.boundingBox();
            await wrap.evaluate(el=>{el.scrollLeft=Math.min(220,el.scrollWidth-el.clientWidth); el.dispatchEvent(new Event('scroll'));});
            await page.waitForTimeout(350);
            const bankAfter=await bank.boundingBox();
            const metricAfter=await metric.boundingBox();
            check(bankBefore&&bankAfter&&Math.abs(bankBefore.x-bankAfter.x)<3,`bank column moved horizontally: ${bankBefore?.x} -> ${bankAfter?.x}`);
            if(metricBefore&&metricAfter) check(metricAfter.x < metricBefore.x-20,'metric columns did not pan horizontally');

            for(const section of ['funding','soundness','profitability']){
              await page.locator(`#mi-section-tabs [data-mi-section="${section}"]`).click();
              await page.waitForTimeout(900);
              check(await page.locator('#mi-content .mi-table tbody tr').count()>=70,`mobile ${section} row shortage`);
              const firstBank=page.locator('#mi-content .mi-table tbody tr td:nth-child(2)').first();
              const txt=(await firstBank.textContent()||'').trim();
              check(!txt.includes('저축은행'),`mobile ${section} suffix remained: ${txt}`);
              const pos=await firstBank.evaluate(el=>getComputedStyle(el).position);
              check(pos==='sticky',`mobile ${section} bank column not sticky: ${pos}`);
            }
            check(pageErrors.length===0,`mobile page errors: ${pageErrors.join(' || ')}`);
            await page.close();
            console.log('MOBILE_BROWSER_OK');
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              await desktop(browser);
              await mobile(browser);
              console.log('FINAL_BROWSER_MECE_OK');
            }finally{
              await browser.close();
            }
          })().catch(err=>{console.error(err);process.exit(1);});
          JS
          node /tmp/final-browser-audit.js

      - name: Final audit summary
        run: echo 'FINAL_SBRate_DESKTOP_MOBILE_DATA_MECE_OK'
