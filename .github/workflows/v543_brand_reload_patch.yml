name: V5.43 Brand Reload Patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/v543_brand_reload_patch.py'
      - '.github/workflows/v543_brand_reload_patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply brand reload patch
        run: python .github/v543_brand_reload_patch.py

      - name: Validate patch
        run: |
          grep -q 'onclick="window.location.reload()"' templates/index.html
          grep -q 'onclick="window.location.reload()"' templates/mobile.html
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/index.html templates/mobile.html
          git add -u .github
          git commit -m "Make dashboard brand refresh the page"
          git push
