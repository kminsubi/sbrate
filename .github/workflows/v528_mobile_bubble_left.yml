name: SBRate V5.28 Mobile Bubble Left

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v528_mobile_bubble_left.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v528_mobile_bubble_left_patch.py

      - name: Validate
        run: |
          grep -q 'SBRate V5.28 MOBILE BUBBLE LEFT TUNE' static/css/v513-mobile-hero-hotfix.css
          grep -q 'left:108px !important' static/css/v513-mobile-hero-hotfix.css
          grep -q 'left:96px !important' static/css/v513-mobile-hero-hotfix.css
          grep -q 'left:112px !important' static/css/v513-mobile-hero-hotfix.css
          grep -q 'v513-mobile-hero-hotfix.css?v=20260815v528' templates/mobile.html

      - name: Commit and clean
        run: |
          rm -f .github/v528_mobile_bubble_left_patch.py .github/workflows/v528_mobile_bubble_left.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/css/v513-mobile-hero-hotfix.css templates/mobile.html .github/v528_mobile_bubble_left_patch.py .github/workflows/v528_mobile_bubble_left.yml
          git commit -m 'Move mobile Wibee bubble one step left'
          git push origin main
