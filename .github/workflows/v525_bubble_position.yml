name: SBRate V5.25 Bubble Position

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v525_bubble_position.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v525_bubble_position_patch.py

      - name: Validate
        run: |
          grep -q 'SBRate V5.25 PC BUBBLE POSITION' static/css/dashboard.css
          grep -q 'left:0px !important' static/css/dashboard.css
          grep -q 'SBRate V5.25 MOBILE BUBBLE POSITION' static/css/v513-mobile-hero-hotfix.css
          grep -q 'left:100px !important' static/css/v513-mobile-hero-hotfix.css
          grep -q 'dashboard.css?v=20260815v525' templates/index.html
          grep -q 'v513-mobile-hero-hotfix.css?v=20260815v525' templates/mobile.html
          git diff --check

      - name: Commit and clean
        run: |
          rm -f .github/v525_bubble_position_patch.py .github/workflows/v525_bubble_position.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/css/dashboard.css static/css/v513-mobile-hero-hotfix.css templates/index.html templates/mobile.html .github/v525_bubble_position_patch.py .github/workflows/v525_bubble_position.yml
          git commit -m 'Fine tune PC and mobile bubble positions'
          git push origin main
