name: SBRate V5.18 PC Header Wibee Hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v518_pc_header_wibee.yml
      - .github/v518_pc_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply PC hotfix
        run: python .github/v518_pc_patch.py

      - name: Validate
        shell: bash
        run: |
          grep -q 'SBRate V5.18 PC HEADER + WIBEE HOTFIX' static/css/dashboard.css
          grep -q 'width:156px !important' static/css/dashboard.css
          grep -q 'sb-v518-pc-wibee-idle' static/css/dashboard.css
          grep -q 'dashboard.css?v=20260815v518' templates/index.html
          git diff --check

      - name: Commit and clean temporary files
        shell: bash
        run: |
          rm -f .github/v518_pc_patch.py
          rm -f .github/workflows/v518_pc_header_wibee.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/css/dashboard.css templates/index.html .github/v518_pc_patch.py .github/workflows/v518_pc_header_wibee.yml
          git commit -m "Fix PC header wrap and Wibee motion"
          git push origin main
