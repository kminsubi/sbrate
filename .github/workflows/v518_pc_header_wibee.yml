name: SBRate V5.18 PC Header Wibee Hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v518_pc_header_wibee.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply PC-only hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path=Path('static/css/dashboard.css')
          html_path=Path('templates/index.html')

          css=css_path.read_text(encoding='utf-8')
          marker='SBRate V5.18 PC HEADER + WIBEE HOTFIX'

          block=r'''

/* =====================================================
   SBRate V5.18 PC HEADER + WIBEE HOTFIX
   - keep dashboard header title on one line
   - slightly reduce PC Wibee size
   - retain one-shot briefing intro and add calm continuous idle motion
===================================================== */

/* Prevent the dashboard title from being compressed into two lines. */
body > header h1{
  white-space:nowrap !important;
  flex-shrink:0 !important;
  min-width:max-content !important;
  line-height:1.2 !important;
}

/* PC Wibee was visually oversized inside the fixed 178px briefing card. */
img[alt="위비 캐릭터"]{
  width:156px !important;
  height:250px !important;
  max-width:none !important;
}

/*
 * Keep the existing one-shot briefing animation on the image.
 * Add the ongoing micro-motion to its wrapper so transform animations never fight.
 */
div:has(> img[alt="위비 캐릭터"]){
  transform-origin:55% 82% !important;
  animation:sb-v518-pc-wibee-idle 5.2s ease-in-out 1.45s infinite both !important;
  will-change:transform;
}

@keyframes sb-v518-pc-wibee-idle{
  0%,100%{transform:translate3d(0,0,0) rotate(0deg)}
  25%{transform:translate3d(0,-1px,0) rotate(-.35deg)}
  50%{transform:translate3d(1px,0,0) rotate(.3deg)}
  75%{transform:translate3d(0,1px,0) rotate(-.15deg)}
}

/* Give the header a little more breathing room on common notebook widths. */
@media (max-width:1500px){
  body > header h1{
    font-size:14px !important;
  }
  #market-product-tabs{
    margin-left:.25rem !important;
  }
}

@media (prefers-reduced-motion:reduce){
  div:has(> img[alt="위비 캐릭터"]){
    animation:none !important;
    transform:none !important;
  }
}
'''

          if marker not in css:
              css=css.rstrip()+block+'\n'
              css_path.write_text(css,encoding='utf-8')

          html=html_path.read_text(encoding='utf-8')
          old='/static/css/dashboard.css?v=20260815v513'
          new='/static/css/dashboard.css?v=20260815v518'
          if old in html:
              html=html.replace(old,new,1)
          elif new not in html:
              raise SystemExit('dashboard.css cache-bust marker not found')
          html_path.write_text(html,encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          grep -q 'SBRate V5.18 PC HEADER + WIBEE HOTFIX' static/css/dashboard.css
          grep -q 'width:156px !important' static/css/dashboard.css
          grep -q 'sb-v518-pc-wibee-idle' static/css/dashboard.css
          grep -q 'dashboard.css?v=20260815v518' templates/index.html
          grep -q 'white-space:nowrap !important' static/css/dashboard.css
          git diff --check

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/v518_pc_header_wibee.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/css/dashboard.css templates/index.html .github/workflows/v518_pc_header_wibee.yml
          git commit -m "Fix PC header wrap and Wibee motion"
          git push origin main
