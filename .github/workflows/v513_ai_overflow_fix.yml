name: SBRate V5.13 AI Overflow Fix

on:
  push:
    branches:
      - agent/v513-professional-polish
    paths:
      - .github/workflows/v513_ai_overflow_fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v513-professional-polish
          fetch-depth: 0
      - run: python .github/v513_ai_overflow_fix.py
      - run: |
          node --check static/js/dashboard.js
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/index.html static/js/dashboard.js
          git commit -m "Allow AI center internal scrolling on all tabs"
          git push origin HEAD:agent/v513-professional-polish
