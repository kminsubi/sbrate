name: SBRate V5.37 Mobile Pointer Cue

on:
  push:
    branches: [main]
    paths:
      - '.github/v537_mobile_pointer_patch.py'
      - '.github/workflows/v537_mobile_pointer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v537_mobile_pointer_patch.py

      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('static/css/v513-mobile-hero-hotfix.css').read_text(encoding='utf-8')
          html = Path('templates/mobile.html').read_text(encoding='utf-8')
          assert 'SBRate V5.37 MOBILE POINTER CUE PER PRODUCT' in css
          for name in ['deposit','isa','irp']:
              assert f'sb-v537-pointer-{name}' in css
          assert 'v513-mobile-hero-hotfix.css?v=20260815v537' in html
          PY
          git diff --check

      - name: Commit and clean
        run: |
          rm -f .github/v537_mobile_pointer_patch.py
          rm -f .github/workflows/v537_mobile_pointer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/css/v513-mobile-hero-hotfix.css templates/mobile.html .github
          git commit -m 'Replay mobile briefing pointer per product'
          git push origin main
