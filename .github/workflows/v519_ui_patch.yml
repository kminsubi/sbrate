name: SBRate V5.19 PC Mobile Wibee Polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v519_ui_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply UI patch
        run: python .github/v519_ui_patch.py

      - name: Validate
        shell: bash
        run: |
          grep -q 'dashboard.css?v=20260815v519' templates/index.html
          grep -q 'v513-mobile-hero-hotfix.css?v=20260815v519' templates/mobile.html
          grep -q 'grid-cols-3 gap-1 w-full text-center' templates/index.html
          grep -q 'hidden bg-white/90 border border-blue-100 rounded-md px-1 py-1' templates/index.html
          grep -q 'SBRate V5.19 PC MOBILE-WIBEE CONSISTENCY' static/css/dashboard.css
          grep -q 'sb-v519-mobile-bubble-deposit' static/css/v513-mobile-hero-hotfix.css
          grep -q '브리핑을 시작할게요' static/css/dashboard.css
          git diff --check

      - name: Commit and clean temporary files
        shell: bash
        run: |
          rm -f .github/v519_ui_patch.py .github/workflows/v519_ui_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish PC header and unify Wibee briefing motion"
          git push origin main
