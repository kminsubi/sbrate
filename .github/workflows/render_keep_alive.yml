name: SBRate Render Keep Alive

on:
  schedule:
    # KST 06:00-23:00, weekdays only.
    # GitHub Actions cron uses UTC, so the KST window spans two UTC dates.
    # Start exactly at 06:00 KST.
    - cron: "0 21 * * 0-4"
    # Then keep Render warm every 5 minutes at off-peak minute offsets
    # (03,08,13,...,58) to avoid common :00/:05 scheduler congestion.
    # 06:03-08:58 KST = 21:03-23:58 UTC on the previous date (Sun-Thu).
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 21-23 * * 0-4"
    # 09:03-22:58 KST = 00:03-13:58 UTC on the same date (Mon-Fri).
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 0-13 * * 1-5"
    # Final 23:00 KST keep-alive = 14:00 UTC (Mon-Fri).
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  keep-alive:
    if: github.event_name != 'issues' || github.event.issue.title == 'V5.45 APPLY VISITOR STATS'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Korean business hours
        id: business_hours
        shell: bash
        run: |
          # Manual and one-shot issue runs are allowed at any time for testing/patching.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual/issue keep-alive run"
            exit 0
          fi

          KST_DATE=$(TZ=Asia/Seoul date +%F)
          KST_MD=$(TZ=Asia/Seoul date +%m-%d)
          KST_WEEKDAY=$(TZ=Asia/Seoul date +%u)
          KST_HM=$(TZ=Asia/Seoul date +%H%M)

          # Defensive guard: weekdays, 06:00-23:00 KST only.
          if [ "$KST_WEEKDAY" -gt 5 ] || [ "$KST_HM" -lt 0600 ] || [ "$KST_HM" -gt 2300 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside Korean business hours: $KST_DATE $KST_HM"
            exit 0
          fi

          # Fixed-date Korean public holidays.
          case "$KST_MD" in
            01-01|03-01|05-05|06-06|08-15|10-03|10-09|12-25)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Korean public holiday: $KST_DATE"
              exit 0
              ;;
          esac

          # 2026 lunar/substitute holidays and statutory election day.
          case "$KST_DATE" in
            2026-02-16|2026-02-17|2026-02-18|2026-03-02|2026-05-25|2026-06-03|2026-08-17|2026-09-24|2026-09-25|2026-09-28|2026-10-05)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Korean public/substitute/election holiday: $KST_DATE"
              exit 0
              ;;
          esac

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Keep-alive enabled: $KST_DATE $KST_HM KST"

      - name: Apply pending V5.45 visitor stats patch
        if: steps.business_hours.outputs.run == 'true'
        shell: bash
        run: |
          if [ ! -f .github/v545_visitor_stats_patch.py ]; then
            echo "No pending V5.45 patch"
            exit 0
          fi

          python .github/v545_visitor_stats_patch.py
          python -m py_compile app.py
          git diff --check

          # Restore both production workflows to their clean pre-patch state.
          git show 96c938fda70136d5c505edcff413e99ebadff211:.github/workflows/render_keep_alive.yml > .github/workflows/render_keep_alive.yml
          git show 96c938fda70136d5c505edcff413e99ebadff211:.github/workflows/telegram_morning.yml > .github/workflows/telegram_morning.yml
          rm -f .github/v545_visitor_stats_patch.py
          rm -f .github/workflows/v545_visitor_stats_patch.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github
          git diff --cached --check
          git commit -m "Add anonymous dashboard visitor stats"
          git push origin main

      - name: Keep Render awake
        if: steps.business_hours.outputs.run == 'true'
        shell: bash
        run: |
          curl --fail --show-error --silent --location \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 120 \
            -H "User-Agent: SBRate-KeepAlive/1.0" \
            "https://sbrate.onrender.com/" > /dev/null

          echo "Render keep-alive request completed at $(TZ=Asia/Seoul date '+%F %T KST')"
