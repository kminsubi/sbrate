name: SBRate V5.21 PC Wibee Position

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v521_pc_wibee_position.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v521_pc_wibee_position.py

      - name: Validate
        shell: bash
        run: |
          grep -q 'SBRate V5.21 PC WIBEE POSITION TUNE' static/css/dashboard.css
          grep -q 'top:8px !important' static/css/dashboard.css
          grep -q 'left:4px !important' static/css/dashboard.css
          grep -q 'top:-6px !important' static/css/dashboard.css
          grep -q 'dashboard.css?v=20260815v521' templates/index.html
          git diff --check

      - name: Commit and clean
        shell: bash
        run: |
          rm -f .github/v521_pc_wibee_position.py .github/workflows/v521_pc_wibee_position.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/css/dashboard.css templates/index.html .github
          git commit -m "Tune PC Wibee and speech bubble position"
          git push origin main
