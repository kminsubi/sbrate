name: SBRate V5.13 Professional Polish Patch

on:
  push:
    branches:
      - agent/v513-professional-polish
    paths:
      - .github/workflows/v513_professional_polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safe branch
        uses: actions/checkout@v4
        with:
          ref: agent/v513-professional-polish
          fetch-depth: 0

      - name: Apply targeted V5.13 patch
        run: python .github/v513_professional_polish.py

      - name: Validate Python JavaScript JSON and invariants
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app.py
          node --check static/js/dashboard.js
          node --check static/js/mobile.js
          python - <<'PY'
          from pathlib import Path
          import json

          pc = Path("templates/index.html").read_text(encoding="utf-8")
          mobile = Path("templates/mobile.html").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")
          dashjs = Path("static/js/dashboard.js").read_text(encoding="utf-8")
          mobilejs = Path("static/js/mobile.js").read_text(encoding="utf-8")
          dashcss = Path("static/css/dashboard.css").read_text(encoding="utf-8")
          mobcss = Path("static/css/v512-mobile.css").read_text(encoding="utf-8")

          pc_ids = [
              "market-product-tabs", "kpi-rank", "kpi-woori-rate-mini",
              "kpi-best-rate-mini", "kpi-average-rate", "kpi-product-count",
              "kpi-change-count", "executive-summary-mini", "ai-question",
              "top5-table-body", "top10-table-body", "rates-up-list",
              "rates-down-list", "ai-analysis-center", "ai-center-content",
              "ai-report-btn", "product-search-panel"
          ]
          for item in pc_ids:
              count = pc.count(f'id="{item}"')
              assert count == 1, (item, count)

          mobile_ids = [
              "mobile-product-tabs", "hero-woori-product", "hero-woori-rate",
              "hero-gap-top", "hero-ai-brief", "mobile-report-open",
              "mobile-report-title", "mobile-report-basis", "mobile-ai-question"
          ]
          for item in mobile_ids:
              count = mobile.count(f'id="{item}"')
              assert count == 1, (item, count)

          for route in ["/api/kpi", "/api/woori", "/api/rates", "/api/rate-changes", "/api/isa", "/api/irp"]:
              assert route in app or route in dashjs or route in mobilejs, route

          assert "/static/images/wibee.png?v=20260815v513" in pc
          assert "/static/images/wibee.png?v=20260815v513" in mobile
          assert "📊 AI 보고서" in pc
          assert "AI 시장분석 보고서" not in pc
          assert "데이터 업데이트 기준 -" in pc
          assert "데이터 업데이트 기준 -" in mobile
          assert "────────────" in app
          assert "━━━━━━━━━━━━" not in app
          assert "대표상품 · 회전정기예금" in dashcss
          assert "align-self:stretch !important" in dashcss
          assert "max-height:none !important" in dashcss
          assert "prefers-reduced-motion:reduce" in dashcss
          assert "prefers-reduced-motion:reduce" in mobcss
          assert "각 저축은행 홈페이지" in dashcss
          assert "각 저축은행 홈페이지" in mobcss

          for path in [
              "data/isa_rates.json",
              "data/irp_rates.json",
              "data/latest_rates.json",
              "data/previous_rates.json",
          ]:
              p = Path(path)
              if p.exists():
                  json.loads(p.read_text(encoding="utf-8"))
                  print("json ok:", path)

          print("V5.13 invariant validation OK")
          PY
          git diff --check

      - name: Show scoped diff
        run: |
          git status --short
          git diff --stat
          git diff -- app.py templates/index.html templates/mobile.html static/css/dashboard.css static/css/v512-mobile.css static/js/dashboard.js static/js/mobile.js | sed -n '1,900p'

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/index.html templates/mobile.html static/css/dashboard.css static/css/v512-mobile.css static/js/dashboard.js static/js/mobile.js
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "SBRate V5.13 professional polish"
          git push origin HEAD:agent/v513-professional-polish
