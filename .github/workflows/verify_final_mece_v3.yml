name: Verify Final MECE V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify_final_mece_v3.yml'
      - 'static/js/dashboard_final_guard.js'
      - 'static/js/dashboard.js'
      - 'static/js/mobile.js'
      - 'static/js/management_*.js'
      - 'static/css/management_*.css'
      - 'management_*.py'
      - 'fisis_*.py'
      - 'scheduler.py'
  workflow_dispatch:

concurrency:
  group: verify-final-mece-v3
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Static and live data audit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile fisis_management.py fisis_intelligence_store.py fisis_profitability_period_patch.py management_intelligence.py management_export_v2.py management_report_auto_update.py management_report_v5_runtime.py scheduler.py
          for f in static/js/dashboard.js static/js/mobile.js static/js/dashboard_final_guard.js static/js/management_report.js static/js/management_intelligence.js static/js/management_report_stability.js static/js/management_report_bank_focus.js; do node --check "$f"; done
          python - <<'PY'
          import io,json,math,time,urllib.parse,urllib.request,zipfile,html
          B='https://sbrate.onrender.com'; H={'User-Agent':'SBRate-Final-V3/1.0'}
          def raw(path,timeout=180):
              req=urllib.request.Request(B+path,headers=H)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  assert r.status==200,(path,r.status); return r.read()
          def js(path): return json.loads(raw(path).decode('utf-8'))
          def items(d):
              if isinstance(d,list):return d
              if isinstance(d,dict):
                  for k in ('products','all_products','items','rates','data','rows'):
                      if isinstance(d.get(k),list):return d[k]
              return []
          # Wait until final dashboard/stability assets are live.
          for i in range(90):
              try:
                  root=raw('/').decode('utf-8','ignore'); mobile=raw('/mobile').decode('utf-8','ignore')
                  if all(x in root and x in mobile for x in ('dashboard_final_guard.js?v=20260826df1','management_report_stability.js?v=20260826mi14')):break
              except Exception:pass
              time.sleep(10)
          else: raise AssertionError('final assets not live')
          assert root.count('id="error-report-open"')==1 and mobile.count('id="mobile-error-report"')==1
          assert '데이터 업데이트 기준' in root

          # Dashboard APIs.
          kpi=js('/api/kpi'); woori=js('/api/woori'); ai=js('/api/ai')
          top10=items(js('/api/rates?period=12')); products=items(js('/api/products')); isa=items(js('/api/isa?period=12')); irp=items(js('/api/irp?period=12'))
          assert len(top10)>=10 and len(products)>=70 and isa and irp,(len(top10),len(products),len(isa),len(irp))
          def n(v):
              try:x=float(v);return x if math.isfinite(x) else None
              except:return None
          assert sum(1 for x in products if isinstance(x,dict) and n(x.get('rate')) and n(x.get('rate'))>0)>=70
          assert n(woori.get('rate')) and int(woori.get('market_rank') or 0)>0
          st=' | '.join(map(str,ai.get('summary') or []))
          for t in ('분석상품','평균금리','최고금리','최저금리','금리 스프레드'):assert t in st,t

          # Management + quarter logic.
          qs=(js('/api/management-report/quarters').get('quarters') or []); assert len(qs)>=2
          latest,prev=qs[0]['key'],qs[1]['key']; year=int(latest[:4]); qno=int(latest[-1]); expected_prev=f'{year-1}Q4' if qno==1 else f'{year}Q{qno-1}'
          assert prev==expected_prev,(latest,prev,expected_prev)
          general=js('/api/management-report?'+urllib.parse.urlencode({'base':latest,'compare':prev})); rows=general.get('rows') or []
          assert general.get('ok') is True and len(rows)>=70
          names=[str(x.get('bank') or '') for x in rows];assert len(names)==len(set(names))
          ranks=sorted(int(x['rank']) for x in rows if x.get('rank') is not None);assert ranks==list(range(1,len(ranks)+1))
          w=next((x for x in rows if '우리금융' in str(x.get('bank') or '')),None);assert w and w.get('rank') is not None

          # Three expanded sections + ROA/ROE.
          intel={}
          for s in ('funding','soundness','profitability'):
              d=js('/api/management-intelligence?'+urllib.parse.urlencode({'section':s,'base':latest,'compare':prev}));assert d.get('ok') is True and d.get('ready') is True and len(d.get('rows') or [])>=70 and d.get('woori');intel[s]=d
          p=intel['profitability'];pm=(p.get('woori') or {}).get('metrics') or {};roa=(pm.get('roa') or {}).get('base');roe=(pm.get('roe') or {}).get('base')
          assert roa is not None and -100<float(roa)<100;assert roe is not None and -300<float(roe)<300;assert int(p.get('derived_profitability_count') or 0)>=70
          per=p.get('periodicity') or {};assert per.get('quarterly_roa_roe') is True and per.get('official_se010_quarterly_supported') is False

          # 8 Excel shapes.
          labels={'general':'종합현황','funding':'수신·조달','soundness':'건전성','profitability':'수익성'}
          for s,label in labels.items():
              for mode in ('single','compare'):
                  q={'section':s,'mode':mode,'base':latest};
                  if mode=='compare':q['compare']=prev
                  z=zipfile.ZipFile(io.BytesIO(raw('/api/management-export.xlsx?'+urllib.parse.urlencode(q))));xml=html.unescape(z.read('xl/worksheets/sheet1.xml').decode())
                  exp=f'{label} 분기현황' if mode=='single' else f'{label} 분기비교';assert exp in xml,(s,mode)
                  head=xml.split('</row>',1)[0];assert ((' vs ' not in head) if mode=='single' else (' vs ' in head))
          lc=js('/api/management-report/check-latest');assert lc.get('ok') is True
          print('DATA_FINAL_OK',{'latest':latest,'previous':prev,'products':len(products),'top10':len(top10),'isa':len(isa),'irp':len(irp),'banks':len(rows),'woori_rank':w.get('rank'),'roa':roa,'roe':roe})
          PY

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser audit PC and mobile
        shell: bash
        run: |
          set -euo pipefail
          cat > final-browser-audit.cjs <<'JS'
          const {chromium}=require('playwright');
          const B='https://sbrate.onrender.com',ok=(c,m)=>{if(!c)throw new Error(m)},wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function settle(p){await p.waitForLoadState('domcontentloaded');await p.waitForTimeout(4500)}
          async function pc(b){
            const p=await b.newPage({viewport:{width:1920,height:1080}}),errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.goto(B+'/',{waitUntil:'domcontentloaded',timeout:120000});await settle(p);
            const dims=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));ok(dims.sw<=dims.cw+2,'PC horizontal overflow '+JSON.stringify(dims));
            const h=p.locator('body > header');ok(await h.count()===1,'PC header missing');ok(['sticky','fixed'].includes(await h.evaluate(e=>getComputedStyle(e).position)),'PC header not sticky');ok((await p.locator('body').innerText()).includes('데이터 업데이트 기준'),'PC update label missing');
            const c=p.locator('#header-current-datetime');ok(await c.isVisible(),'clock hidden');const cb=await c.boundingBox();ok(cb&&cb.x+cb.width<=1922,'clock clipped '+JSON.stringify(cb));await p.evaluate(()=>scrollTo(0,700));await wait(300);const hb=await h.boundingBox();ok(hb&&Math.abs(hb.y)<=2,'PC header scrolls away');await p.evaluate(()=>scrollTo(0,0));
            ok(await p.locator('#management-report-open').count()===1,'PC management duplicate/missing');ok(await p.locator('#error-report-open').count()===1,'PC error duplicate/missing');await p.locator('#management-report-open').click();await p.waitForSelector('#management-report-modal.is-open',{timeout:15000});ok(await p.locator('#mr-export-single').isVisible(),'PC Excel missing');ok(await p.locator('#mi-section-tabs [data-mi-section]').count()===4,'PC section tabs !=4');
            for(const s of ['general','funding','soundness','profitability']){await p.locator(`#mi-section-tabs [data-mi-section="${s}"]`).click();await wait(1100);if(s==='general')ok(await p.locator('#mr-table tbody tr').count()>=20,'PC general rows too few');else{ok(await p.locator('#mi-content .mi-table tbody tr').count()>=70,s+' PC rows too few');ok(await p.locator('#mi-content .mi-bank-focus-btn').count()>=1,s+' Woori button missing')}}
            await p.locator('#mr-close').click();await wait(400);const labs=(await p.locator('#executive-summary-mini span').allTextContents()).map(x=>x.trim());ok(labs.includes('시장 최저'),'AI 시장최저 missing '+labs.join('|'));const snap=labs.filter(x=>['분석상품','평균금리','금리 스프레드','시장 최고','시장 최저','우리금융'].includes(x));ok(!snap.includes('우리금융'),'AI snapshot Woori duplicated '+snap.join('|'));ok(errs.length===0,'PC JS errors '+errs.join(' || '));await p.close();console.log('PC_BROWSER_OK');
          }
          async function mobile(b){
            const p=await b.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true}),errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.goto(B+'/mobile',{waitUntil:'domcontentloaded',timeout:120000});await settle(p);const dims=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));ok(dims.sw<=dims.cw+2,'mobile page overflow '+JSON.stringify(dims));
            ok(await p.locator('#management-report-open-mobile').count()===1,'mobile management duplicate/missing');ok(await p.locator('#mobile-error-report').count()===1,'mobile error duplicate/missing');await p.locator('#management-report-open-mobile').click();await p.waitForSelector('#management-report-modal.is-open',{timeout:15000});ok(await p.locator('#mr-export-single').isVisible(),'mobile Excel missing');await p.locator('#mi-section-tabs [data-mi-section="general"]').click();await wait(1100);ok(await p.locator('#mr-table tbody tr').count()>=20,'mobile general rows too few');
            const bank=p.locator('#mr-table tbody .mr-col-bank').first(),bs=await bank.evaluate(e=>({p:getComputedStyle(e).position,w:e.getBoundingClientRect().width,t:e.textContent.trim()}));ok(bs.p==='sticky','general bank not sticky '+JSON.stringify(bs));ok(bs.w<=110,'bank width '+bs.w);ok(!bs.t.includes('저축은행'),'general suffix remains');const modal=p.locator('#management-report-modal');await modal.evaluate(el=>{const t=document.getElementById('mr-table'),mr=el.getBoundingClientRect(),tr=t.getBoundingClientRect();el.scrollTo(0,Math.max(0,el.scrollTop+tr.top-mr.top+260));});await wait(700);const fl=p.locator('#mr-mobile-column-header');ok(await fl.count()===1,'mobile floating header absent');ok(await fl.isVisible(),'mobile floating header hidden');
            const wrap=p.locator('#mr-table').locator('xpath=ancestor::*[contains(@class,"mr-table-wrap")][1]'),b0=await bank.boundingBox(),metric=p.locator('#mr-table tbody tr').first().locator('td').nth(4),m0=await metric.boundingBox();await wrap.evaluate(el=>{el.scrollLeft=Math.min(220,Math.max(0,el.scrollWidth-el.clientWidth));el.dispatchEvent(new Event('scroll'));});await wait(400);const b1=await bank.boundingBox(),m1=await metric.boundingBox();ok(b0&&b1&&Math.abs(b0.x-b1.x)<3,'bank column moved');if(m0&&m1)ok(m1.x<m0.x-15,'metric horizontal pan failed');
            for(const s of ['funding','soundness','profitability']){await p.locator(`#mi-section-tabs [data-mi-section="${s}"]`).click();await wait(1200);const rs=p.locator('#mi-content .mi-table tbody tr');ok(await rs.count()>=70,s+' mobile rows too few');const bc=rs.first().locator('td').nth(1),txt=(await bc.textContent()||'').trim();ok(!txt.includes('저축은행'),s+' suffix remains');ok((await bc.evaluate(e=>getComputedStyle(e).position))==='sticky',s+' bank not sticky')}
            ok(errs.length===0,'mobile JS errors '+errs.join(' || '));await p.close();console.log('MOBILE_BROWSER_OK');
          }
          (async()=>{const b=await chromium.launch({headless:true});try{await pc(b);await mobile(b);console.log('FINAL_BROWSER_MECE_OK')}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node final-browser-audit.cjs

      - name: Final marker
        run: echo FINAL_SBRate_MECE_V3_OK
