name: Verify Management MECE

on:
  push:
    branches: [main]
    paths:
      - 'fisis_*.py'
      - 'management_*.py'
      - 'industry_decision_support.py'
      - 'static/js/management_*.js'
      - 'static/css/management_*.css'
      - 'static/js/industry_*.js'
      - 'static/css/industry_*.css'
      - 'scheduler.py'
      - '.github/workflows/verify_management_mece.yml'
  workflow_dispatch:

concurrency:
  group: verify-management-mece-static
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Static management contracts
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile fisis_*.py management_*.py industry_decision_support.py scheduler.py
          for f in static/js/management_*.js static/js/industry_*.js; do
            node --check "$f"
          done

          grep -q 'MIN_QUARTER_COVERAGE = 0.90' fisis_management.py
          grep -q 'SE017' fisis_profitability_period_patch.py
          grep -q 'annualized_income' fisis_profitability_period_patch.py
          ! grep -q 'TABLES\["SE010"\]' fisis_intelligence_store.py

          grep -q 'PEER_COMPARE_VERSION = "20260827peer2"' management_report_v5_runtime.py
          grep -q 'DECISION_SUPPORT_VERSION = "20260827ds3"' management_report_v5_runtime.py
          grep -q 'DECISION_VIEWPORT_FIX_VERSION = "20260827ds5"' management_report_v5_runtime.py
          grep -q 'EXECUTIVE_MATRIX_VERSION = "20260911mx3"' management_report_v5_runtime.py

          grep -q 'install_management_executive_matrix' management_report_v5_runtime.py
          grep -q '/api/management-executive-matrix' management_executive_matrix.py
          grep -q 'executive_peer_matrix_v2' management_executive_matrix.py
          grep -q 'loan_interest_income' management_executive_matrix.py
          grep -q 'A40' management_executive_matrix.py
          grep -q 'B530' management_executive_matrix.py
          grep -q 'A22' management_executive_matrix.py

          grep -q 'autoOpenFromManagementButton' static/js/management_executive_matrix.js
          grep -q 'management-report-open-mobile' static/js/management_executive_matrix.js
          grep -q 'mx-detail' static/js/management_executive_matrix.js
          grep -q 'mx-best' static/css/management_executive_matrix.css

      - name: MECE static success
        run: echo MANAGEMENT_MECE_STATIC_OK
