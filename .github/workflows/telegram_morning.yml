name: SBRateBot Telegram Morning Brief

on:
  schedule:
    # 07:15 KST target. Recent GitHub schedule delay is ~15-30 min; 22:15 UTC = 07:15 KST (next day)
    - cron: "15 22 * * *"
  workflow_dispatch:

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Wake Render
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 15 \
            --max-time 180 \
            "https://sbrate.onrender.com/" > /dev/null

      - name: Wait for warm service
        run: sleep 60

      - name: Send Telegram morning brief
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 20 \
            --max-time 180 \
            -X POST \
            -H "X-SBRate-Secret: ${{ secrets.TELEGRAM_BRIEF_SECRET }}" \
            "https://sbrate.onrender.com/telegram/morning-brief"
