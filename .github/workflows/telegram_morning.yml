name: SBRateBot Telegram Morning Brief

on:
  schedule:
    # 08:00 KST = 23:00 UTC (previous day)
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Wake Render and send Telegram morning brief
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 20 \
            --max-time 180 \
            -X POST \
            -H "X-SBRate-Secret: ${{ secrets.TELEGRAM_BRIEF_SECRET }}" \
            "https://sbrate.onrender.com/telegram/morning-brief"
