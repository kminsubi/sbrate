name: SBRateBot Telegram Morning Brief

on:
  schedule:
    # Primary target: 07:30 KST. Fallback every 5 minutes through 09:30 KST.
    # GitHub scheduled events can be delayed or dropped during high load.
    - cron: "30 22 * * 0-4" # 07:30 KST
    - cron: "35 22 * * 0-4" # 07:35 KST
    - cron: "40 22 * * 0-4" # 07:40 KST
    - cron: "45 22 * * 0-4" # 07:45 KST
    - cron: "50 22 * * 0-4" # 07:50 KST
    - cron: "55 22 * * 0-4" # 07:55 KST
    - cron: "0 23 * * 0-4"  # 08:00 KST
    - cron: "5 23 * * 0-4"  # 08:05 KST
    - cron: "10 23 * * 0-4" # 08:10 KST
    - cron: "15 23 * * 0-4" # 08:15 KST
    - cron: "20 23 * * 0-4" # 08:20 KST
    - cron: "25 23 * * 0-4" # 08:25 KST
    - cron: "30 23 * * 0-4" # 08:30 KST
    - cron: "35 23 * * 0-4" # 08:35 KST
    - cron: "40 23 * * 0-4" # 08:40 KST
    - cron: "45 23 * * 0-4" # 08:45 KST
    - cron: "50 23 * * 0-4" # 08:50 KST
    - cron: "55 23 * * 0-4" # 08:55 KST
    - cron: "0 0 * * 1-5"   # 09:00 KST
    - cron: "5 0 * * 1-5"   # 09:05 KST
    - cron: "10 0 * * 1-5"  # 09:10 KST
    - cron: "15 0 * * 1-5"  # 09:15 KST
    - cron: "20 0 * * 1-5"  # 09:20 KST
    - cron: "25 0 * * 1-5"  # 09:25 KST
    - cron: "30 0 * * 1-5"  # 09:30 KST
  workflow_dispatch:

concurrency:
  group: telegram-morning-brief
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout state
        uses: actions/checkout@v4

      - name: Skip Korean public holidays
        id: business_day
        shell: bash
        run: |
          KST_DATE=$(TZ=Asia/Seoul date +%F)
          KST_MD=$(TZ=Asia/Seoul date +%m-%d)

          case "$KST_MD" in
            01-01|03-01|05-05|06-06|08-15|10-03|10-09|12-25)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Korean public holiday: $KST_DATE"
              exit 0
              ;;
          esac

          case "$KST_DATE" in
            2026-02-16|2026-02-17|2026-02-18|2026-03-02|2026-05-25|2026-06-03|2026-08-17|2026-09-24|2026-09-25|2026-09-28|2026-10-05)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Korean public/substitute/election holiday: $KST_DATE"
              exit 0
              ;;
          esac

          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Check daily send guard
        id: guard
        if: steps.business_day.outputs.run == 'true'
        shell: bash
        run: |
          KST_DATE=$(TZ=Asia/Seoul date +%F)
          MARKER=".github/state/morning_brief_last_sent.txt"
          LAST_SENT=""

          if [ -f "$MARKER" ]; then
            LAST_SENT=$(tr -d '[:space:]' < "$MARKER")
          fi

          echo "KST_DATE=$KST_DATE"
          echo "LAST_SENT=$LAST_SENT"

          if [ "$LAST_SENT" = "$KST_DATE" ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "Morning Brief already sent for $KST_DATE; skipping duplicate."
          else
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wake Render
        if: steps.business_day.outputs.run == 'true' && steps.guard.outputs.send == 'true'
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 120 \
            "https://sbrate.onrender.com/" > /dev/null

      - name: Send Telegram morning brief
        if: steps.business_day.outputs.run == 'true' && steps.guard.outputs.send == 'true'
        run: |
          curl --fail --show-error --silent \
            --retry 5 \
            --retry-delay 8 \
            --connect-timeout 10 \
            --max-time 180 \
            -X POST \
            -H "X-SBRate-Secret: ${{ secrets.TELEGRAM_BRIEF_SECRET }}" \
            "https://sbrate.onrender.com/telegram/morning-brief"

      - name: Record successful send date
        if: steps.business_day.outputs.run == 'true' && steps.guard.outputs.send == 'true'
        shell: bash
        run: |
          KST_DATE=$(TZ=Asia/Seoul date +%F)
          MARKER=".github/state/morning_brief_last_sent.txt"
          mkdir -p "$(dirname "$MARKER")"
          printf '%s\n' "$KST_DATE" > "$MARKER"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MARKER"
          git commit -m "Record Telegram morning brief $KST_DATE" || exit 0
          git push
