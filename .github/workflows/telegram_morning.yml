name: SBRateBot Telegram Morning Brief

on:
  schedule:
    # 07:05 KST target. GitHub scheduled workflows can start later under load.
    # Weekdays only; Korean public holidays are filtered in the job below.
    - cron: "5 22 * * 0-4"
  workflow_dispatch:

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Skip Korean public holidays
        id: business_day
        shell: bash
        run: |
          KST_DATE=$(TZ=Asia/Seoul date +%F)
          KST_MD=$(TZ=Asia/Seoul date +%m-%d)

          # Fixed-date Korean public holidays.
          case "$KST_MD" in
            01-01|03-01|05-05|06-06|08-15|10-03|10-09|12-25)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Korean public holiday: $KST_DATE"
              exit 0
              ;;
          esac

          # Lunar New Year / Chuseok / substitute-election holidays.
          # Keep this compact list current when a new year's calendar is confirmed.
          case "$KST_DATE" in
            2026-02-16|2026-02-17|2026-02-18|2026-03-02|2026-05-25|2026-08-17|2026-09-24|2026-09-25|2026-09-28|2026-10-05)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Korean public/substitute holiday: $KST_DATE"
              exit 0
              ;;
          esac

          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Wake Render
        if: steps.business_day.outputs.run == 'true'
        run: |
          curl --fail --show-error --silent \
            --retry 2 \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 120 \
            "https://sbrate.onrender.com/" > /dev/null

      - name: Send Telegram morning brief
        if: steps.business_day.outputs.run == 'true'
        run: |
          # Wake request above blocks until Render responds, so a fixed 60-second
          # sleep is unnecessary. Brief request itself still retries transient starts.
          curl --fail --show-error --silent \
            --retry 4 \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 120 \
            -X POST \
            -H "X-SBRate-Secret: ${{ secrets.TELEGRAM_BRIEF_SECRET }}" \
            "https://sbrate.onrender.com/telegram/morning-brief"
