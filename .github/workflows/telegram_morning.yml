name: SBRateBot Telegram Morning Brief

on:
  schedule:
    # 07:30 KST target. GitHub scheduled workflows can start later under load.
    # Weekdays only; Korean public holidays are filtered in the job below.
    - cron: "30 22 * * 0-4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram_morning.yml"
      - ".github/v545_visitor_stats_patch.py"

permissions:
  contents: write

jobs:
  send-brief:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Skip Korean public holidays
        id: business_day
        shell: bash
        run: |
          KST_DATE=$(TZ=Asia/Seoul date +%F)
          KST_MD=$(TZ=Asia/Seoul date +%m-%d)

          # Fixed-date Korean public holidays.
          case "$KST_MD" in
            01-01|03-01|05-05|06-06|08-15|10-03|10-09|12-25)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Korean public holiday: $KST_DATE"
              exit 0
              ;;
          esac

          # 2026 lunar/substitute holidays and statutory election day.
          case "$KST_DATE" in
            2026-02-16|2026-02-17|2026-02-18|2026-03-02|2026-05-25|2026-06-03|2026-08-17|2026-09-24|2026-09-25|2026-09-28|2026-10-05)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Korean public/substitute/election holiday: $KST_DATE"
              exit 0
              ;;
          esac

          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Wake Render
        if: steps.business_day.outputs.run == 'true'
        run: |
          curl --fail --show-error --silent \
            --retry 2 \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 120 \
            "https://sbrate.onrender.com/" > /dev/null

      - name: Send Telegram morning brief
        if: steps.business_day.outputs.run == 'true'
        run: |
          # Keep-alive starts at 06:00 KST, and this wake request provides an
          # additional guard before sending the 07:30 KST Morning Brief.
          curl --fail --show-error --silent \
            --retry 4 \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 120 \
            -X POST \
            -H "X-SBRate-Secret: ${{ secrets.TELEGRAM_BRIEF_SECRET }}" \
            "https://sbrate.onrender.com/telegram/morning-brief"

  v545-patch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply V5.45 visitor stats patch
        run: python .github/v545_visitor_stats_patch.py

      - name: Validate Python
        run: python -m py_compile app.py

      - name: Restore Morning Brief workflow and clean temporary files
        run: |
          git show HEAD^:.github/workflows/telegram_morning.yml > .github/workflows/telegram_morning.yml
          rm -f .github/v545_visitor_stats_patch.py
          rm -f .github/workflows/v545_visitor_stats_patch.yml

      - name: Validate diff
        run: git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github
          git diff --cached --check
          git commit -m "Add anonymous dashboard visitor stats"
          git push origin main
