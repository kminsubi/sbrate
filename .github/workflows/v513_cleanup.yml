name: SBRate V5.13 One-shot Cleanup

on:
  push:
    branches:
      - agent/v513-professional-polish
    paths:
      - .github/workflows/v513_cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v513-professional-polish
          fetch-depth: 0

      - name: Remove temporary V5.13 validation helpers
        shell: bash
        run: |
          rm -f .github/v513_*
          rm -f .github/workflows/v513_*.yml
          git status --short

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github
          git commit -m "Remove temporary V5.13 validation helpers"
          git push origin HEAD:agent/v513-professional-polish
