name: Verify Industry Status Terminology

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify_industry_status_terminology.yml'
      - 'static/js/management_terminology_patch.js'
      - 'static/css/management_peer_readability_patch.css'
      - 'management_terminology_patch.py'
      - 'management_report_v5_runtime.py'
  workflow_dispatch:

concurrency:
  group: verify-industry-status-terminology
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile management_terminology_patch.py management_report_v5_runtime.py
          node --check static/js/management_terminology_patch.js
          grep -q 'TERMINOLOGY_VERSION = "20260827term1"' management_report_v5_runtime.py
          grep -q "📑 업권현황" static/js/management_terminology_patch.js
          grep -q "경영지표" static/js/management_terminology_patch.js
          grep -q "mp-summary-prefix" static/css/management_peer_readability_patch.css

      - name: Wait for live terminology assets
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 90); do
            curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --max-time 90 https://sbrate.onrender.com/ >/tmp/root.html || true
            curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --max-time 90 https://sbrate.onrender.com/mobile >/tmp/mobile.html || true
            if python - <<'PY'
          from pathlib import Path
          r=Path('/tmp/root.html').read_text(encoding='utf-8',errors='ignore')
          m=Path('/tmp/mobile.html').read_text(encoding='utf-8',errors='ignore')
          required=(
              'management_terminology_patch.js?v=20260827term1',
              'management_peer_readability_patch.css?v=20260827term1',
          )
          assert all(x in r and x in m for x in required)
          PY
            then ready=1; echo TERMINOLOGY_ASSETS_LIVE; break; fi
            echo "waiting terminology assets $i/90"; sleep 10
          done
          test "$ready" = 1

      - name: Verify 경영지표 Excel terminology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io,json,urllib.request,urllib.parse,zipfile,html
          B='https://sbrate.onrender.com'; H={'User-Agent':'SBRate-Terminology-Audit/1.0'}
          def raw(path):
              req=urllib.request.Request(B+path,headers=H)
              with urllib.request.urlopen(req,timeout=180) as r:
                  return r.read(), dict(r.headers)
          qraw,_=raw('/api/management-report/quarters')
          q=json.loads(qraw.decode('utf-8'))['quarters'][0]['key']
          body,headers=raw('/api/management-export.xlsx?'+urllib.parse.urlencode({'section':'general','mode':'single','base':q}))
          z=zipfile.ZipFile(io.BytesIO(body))
          xml='\n'.join(html.unescape(z.read(name).decode('utf-8',errors='ignore')) for name in z.namelist() if name.endswith('.xml'))
          assert '경영지표' in xml, 'Excel still missing 경영지표'
          assert '종합현황' not in xml, 'Excel still contains 종합현황'
          print('EXCEL_TERMINOLOGY_OK', q, headers.get('Content-Disposition',''))
          PY

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify PC and mobile UI
        shell: bash
        run: |
          set -euo pipefail
          cat > terminology-audit.cjs <<'JS'
          const {chromium}=require('playwright');
          const B='https://sbrate.onrender.com';
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          async function openReport(page, mobile=false){
            await page.goto(B+(mobile?'/mobile':'/'),{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(4500);
            const button=page.locator(mobile?'#management-report-open-mobile':'#management-report-open');
            ok((await button.innerText()).includes('업권현황'),'open button terminology');
            await button.click();
            await page.waitForSelector('#management-report-modal.is-open',{timeout:15000});
            await page.waitForTimeout(500);
            ok((await page.locator('#management-report-modal .mr-title-block h2').innerText()).includes('저축은행 업권현황'),'modal title terminology');
            ok((await page.locator('#mi-section-tabs [data-mi-section="general"]').innerText()).trim()==='경영지표','general tab terminology');
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const pc=await browser.newPage({viewport:{width:1920,height:1080}});
            await openReport(pc,false);
            await pc.locator('#mi-section-tabs [data-mi-section="peer"]').click();
            await pc.waitForTimeout(1400);
            const pcSizes=await pc.evaluate(()=>({
              prefix:parseFloat(getComputedStyle(document.querySelector('.mp-summary-prefix')).fontSize),
              item:parseFloat(getComputedStyle(document.querySelector('.mp-summary-item')).fontSize),
              insight:parseFloat(getComputedStyle(document.querySelector('.mp-insight-text')).fontSize),
              bold:parseFloat(getComputedStyle(document.querySelector('.mp-insight-text b')).fontSize),
            }));
            ok(pcSizes.prefix>=12&&pcSizes.item>=12&&pcSizes.insight>=12&&pcSizes.bold>=13,'PC peer readability '+JSON.stringify(pcSizes));
            await pc.close();

            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            await openReport(mobile,true);
            await mobile.locator('#mi-section-tabs [data-mi-section="peer"]').click();
            await mobile.waitForTimeout(1400);
            const moSizes=await mobile.evaluate(()=>({
              prefix:parseFloat(getComputedStyle(document.querySelector('.mp-summary-prefix')).fontSize),
              item:parseFloat(getComputedStyle(document.querySelector('.mp-summary-item')).fontSize),
              insight:parseFloat(getComputedStyle(document.querySelector('.mp-insight-text')).fontSize),
            }));
            ok(moSizes.prefix>=10.5&&moSizes.item>=10.5&&moSizes.insight>=10.5,'mobile peer readability '+JSON.stringify(moSizes));
            await mobile.close();
            await browser.close();
            console.log('INDUSTRY_STATUS_UI_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node terminology-audit.cjs

      - name: Success
        run: echo INDUSTRY_STATUS_TERMINOLOGY_PASS
