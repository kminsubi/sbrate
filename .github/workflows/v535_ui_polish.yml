name: SBRate V5.35 UI Polish

on:
  push:
    paths:
      - '.github/workflows/v535_ui_polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v535_hero_period_polish.py

      - name: Validate
        run: |
          python -m py_compile .github/v535_hero_period_polish.py
          git diff --check
          grep -q 'SBRate V5.35 MOBILE HERO RATE EMPHASIS' static/css/v513-mobile-hero-hotfix.css
          grep -q 'font-size:35.5px' static/css/v513-mobile-hero-hotfix.css
          grep -q 'SBRate V5.35 PC PRODUCT PERIOD EMPHASIS' static/css/dashboard.css
          grep -q '#product-period-select' static/css/dashboard.css
          grep -q 'v513-mobile-hero-hotfix.css?v=20260815v535' templates/mobile.html
          grep -q 'dashboard.css?v=20260815v535' templates/index.html

      - name: Commit and clean
        run: |
          rm -f .github/v535_hero_period_polish.py .github/workflows/v535_ui_polish.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish mobile hero rate and PC period selector' || exit 0
          git push origin main

# rerun after EOF validation fix
