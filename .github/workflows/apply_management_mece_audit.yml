      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            fisis_management.py fisis_quality_patch.py fisis_region_patch.py \
            management_report.py management_report_auto_update.py \
            fisis_intelligence_store.py management_intelligence.py \
            fisis_profitability_period_patch.py management_report_v4_runtime.py \
            management_report_v5_runtime.py scheduler.py
          node --check static/js/management_report.js
          node --check static/js/management_intelligence.js
          git diff --check
          grep -q 'MIN_QUARTER_COVERAGE = 0.90' fisis_management.py
          grep -q 'math.ceil(len(companies) \* MIN_QUARTER_COVERAGE)' fisis_management.py
          grep -q 'previousYearSameQuarter' static/js/management_report.js
          grep -q '고정이하여신비율' static/js/management_intelligence.js
          ! grep -q 'install_fisis_catalog_probe' scheduler.py

      - name: Commit audited fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Harden FISIS management report MECE checks'
            git pull --rebase origin main
            git push origin main
          fi
