name: Apply Management MECE Audit

on:
  push:
    paths:
      - '.github/workflows/apply_management_mece_audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited management fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')
              print('PATCHED',path,old[:70].replace('\n',' '))

          # 1) Core FISIS publication quality: one 90% rule + deterministic asset ranks.
          replace('fisis_management.py','import json\nimport os\n','import json\nimport math\nimport os\n')
          replace(
              'fisis_management.py',
              'CACHE_MAX_AGE = timedelta(days=14)\nKST = timezone(timedelta(hours=9))\n',
              'CACHE_MAX_AGE = timedelta(days=14)\nMIN_QUARTER_COVERAGE = 0.90\nKST = timezone(timedelta(hours=9))\n'
          )
          replace(
              'fisis_management.py',
              'minimum_assets = max(20, int(len(companies) * 0.65))',
              'minimum_assets = max(20, math.ceil(len(companies) * MIN_QUARTER_COVERAGE))'
          )
          replace(
              'fisis_management.py',
              '        rows.sort(key=lambda row: (-(row.get("total_assets") or -1), str(row.get("bank") or "")))\n        for idx, row in enumerate(valid_assets, 1):\n',
              '        rows.sort(key=lambda row: (-(row.get("total_assets") or -1), str(row.get("bank") or "")))\n        # valid_assets was created before sorting; rebuild it so persisted asset_rank\n        # follows the same deterministic total-assets order exposed by the report.\n        valid_assets = [row for row in rows if row.get("total_assets") is not None]\n        for idx, row in enumerate(valid_assets, 1):\n'
          )
          replace(
              'fisis_management.py',
              '        "active_company_count": len(companies),\n        "quarters": quarters,\n',
              '        "active_company_count": len(companies),\n        "minimum_quarter_coverage_ratio": MIN_QUARTER_COVERAGE,\n        "minimum_quarter_asset_count": minimum_assets,\n        "quarters": quarters,\n'
          )

          # Quality patch now follows the core provider constant instead of a divergent rule.
          replace(
              'fisis_quality_patch.py',
              '        active_count = int(store.get("active_company_count") or 0)\n        threshold = max(20, math.ceil(active_count * MIN_QUARTER_COVERAGE))\n',
              '        active_count = int(store.get("active_company_count") or 0)\n        coverage_ratio = float(getattr(fm, "MIN_QUARTER_COVERAGE", MIN_QUARTER_COVERAGE))\n        threshold = max(20, math.ceil(active_count * coverage_ratio))\n'
          )
          replace(
              'fisis_quality_patch.py',
              '        store["minimum_quarter_coverage_ratio"] = MIN_QUARTER_COVERAGE\n',
              '        store["minimum_quarter_coverage_ratio"] = coverage_ratio\n'
          )

          # 2) Latest-quarter probe: same coverage rule, fail-closed distributed lock,
          # and no public force switch that can repeatedly hammer FISIS.
          replace(
              'management_report_auto_update.py',
              '        companies = fm._companies()\n        threshold = max(20, math.ceil(len(companies) * MIN_QUARTER_COVERAGE))\n',
              '        companies = fm._companies()\n        coverage_ratio = float(getattr(fm, "MIN_QUARTER_COVERAGE", MIN_QUARTER_COVERAGE))\n        threshold = max(20, math.ceil(len(companies) * coverage_ratio))\n'
          )
          replace(
              'management_report_auto_update.py',
              '            "coverage_ratio_required": MIN_QUARTER_COVERAGE,\n            "coverage_threshold": threshold,\n',
              '            "coverage_ratio_required": coverage_ratio,\n            "coverage_threshold": threshold,\n',
              expected=1
          )
          replace(
              'management_report_auto_update.py',
              '        "coverage_ratio_required": MIN_QUARTER_COVERAGE,\n        "stored_asset_count": stored_target_count,\n',
              '        "coverage_ratio_required": float(getattr(fm, "MIN_QUARTER_COVERAGE", MIN_QUARTER_COVERAGE)),\n        "stored_asset_count": stored_target_count,\n'
          )
          replace(
              'management_report_auto_update.py',
              '    except Exception as exc:\n        print("FISIS latest-quarter distributed lock error:", exc)\n        return token\n',
              '    except Exception as exc:\n        print("FISIS latest-quarter distributed lock error:", exc)\n        # Fail closed. Without the shared lock, multiple Render workers could\n        # launch the same 79-bank probe concurrently.\n        return None\n'
          )
          replace(
              'management_report_auto_update.py',
              '    from flask import jsonify, request\n',
              '    from flask import jsonify\n'
          )
          replace(
              'management_report_auto_update.py',
              '    def management_report_check_latest():\n        force_probe = str(request.args.get("force") or "").strip() == "1"\n        try:\n            return jsonify(check_latest_quarter(force_probe=force_probe, wait=False))\n',
              '    def management_report_check_latest():\n        try:\n            # Public callers can request a normal check only. Forced probes are\n            # reserved for internal Python calls so this endpoint cannot be used\n            # to generate repeated FISIS traffic.\n            return jsonify(check_latest_quarter(force_probe=False, wait=False))\n'
          )

          # 3) Region diagnostic must use the already-validated cache, not call FISIS on every GET.
          replace(
              'fisis_region_patch.py',
              '                    companies = fm._companies()\n                    with_address = [x for x in companies if x.get("address")]\n                    with_region = [x for x in companies if x.get("region") and x.get("region") != "기타"]\n',
              '                    store = fm.get_management_store(trigger_refresh=False) or {}\n                    quarters = store.get("quarters") if isinstance(store.get("quarters"), dict) else {}\n                    latest_key = max(quarters.keys(), default="")\n                    latest = quarters.get(latest_key) if isinstance(quarters.get(latest_key), dict) else {}\n                    cached_rows = latest.get("banks") if isinstance(latest.get("banks"), list) else []\n                    companies = [\n                        {"finance_nm": row.get("bank"), "address": "", "region": row.get("region")}\n                        for row in cached_rows if isinstance(row, dict)\n                    ]\n                    with_address = [x for x in companies if x.get("address")]\n                    with_region = [x for x in companies if x.get("region") and x.get("region") != "기타"]\n'
          )

          # Catalog scan was a development probe. Stop exposing its expensive live endpoint.
          replace('scheduler.py','from fisis_catalog_probe import install_fisis_catalog_probe\n','')
          replace('scheduler.py','install_fisis_catalog_probe()\n','')
          Path('.github/workflows/scan_fisis_catalog.yml').unlink(missing_ok=True)

          # 4) Base management API: validate quarters, make cumulative P&L comparisons period-safe,
          # publish coverage, and make XLSX defaults match the JSON endpoint.
          replace(
              'management_report.py',
              '\ndef _quarter_sort_key(value):\n',
              '\ndef _valid_quarter(value):\n    return bool(re.fullmatch(r"\\d{4}Q[1-4]", str(value or "")))\n\n\ndef _quarter_no(value):\n    m = re.fullmatch(r"\\d{4}Q([1-4])", str(value or ""))\n    return int(m.group(1)) if m else None\n\n\ndef _quarter_sort_key(value):\n'
          )
          replace(
              'management_report.py',
              '            delta = base_value - compare_value if base_value is not None and compare_value is not None else None\n            metrics[field] = {\n                "label": label, "unit": unit, "kind": kind,\n                "base": base_value, "compare": compare_value, "delta": delta,\n            }\n',
              '            comparable = not (\n                field == "net_income"\n                and _quarter_no(base_quarter) != _quarter_no(compare_quarter)\n            )\n            delta = (\n                base_value - compare_value\n                if comparable and base_value is not None and compare_value is not None\n                else None\n            )\n            metrics[field] = {\n                "label": label, "unit": unit, "kind": kind,\n                "base": base_value, "compare": compare_value, "delta": delta,\n                "comparable": comparable,\n                "delta_reason": None if comparable else "누적기간이 다른 손익 수치는 증감 비교하지 않습니다.",\n            }\n'
          )
          replace(
              'management_report.py',
              '        "source_name": "금융감독원 금융통계정보시스템(FISIS)",\n        "generated_at": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),\n',
              '        "source_name": "금융감독원 금융통계정보시스템(FISIS)",\n        "generated_at": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),\n        "cumulative_comparison_note": "당기순이익 증감은 누적기간이 같은 동일 분기번호끼리만 계산합니다.",\n'
          )
          replace(
              'management_report.py',
              '    subtitle = "출처: 금융감독원 금융통계정보시스템(FISIS) | 금액: 억원 / 비율 증감: %p"\n',
              '    subtitle = "출처: 금융감독원 금융통계정보시스템(FISIS) | 금액: 억원 / 비율 증감: %p | 누적 손익 증감은 동일 분기번호 비교 시만 표시"\n'
          )
          replace(
              'management_report.py',
              '        items = []\n        for key in sorted(quarters.keys(), key=_quarter_sort_key, reverse=True):\n',
              '        items = []\n        active_count = int(store.get("active_company_count") or 0)\n        for key in sorted(quarters.keys(), key=_quarter_sort_key, reverse=True):\n'
          )
          replace(
              'management_report.py',
              '            rows = meta.get("banks") if isinstance(meta.get("banks"), list) else []\n            items.append({\n',
              '            rows = meta.get("banks") if isinstance(meta.get("banks"), list) else []\n            asset_count = int(meta.get("asset_bank_count") or 0)\n            if not asset_count:\n                asset_count = sum(1 for row in rows if isinstance(row, dict) and _num(row.get("total_assets")) is not None)\n            items.append({\n'
          )
          replace(
              'management_report.py',
              '                "bank_count": len(rows),\n                "source_url": meta.get("source_url"),\n',
              '                "bank_count": len(rows),\n                "asset_bank_count": asset_count,\n                "asset_coverage_ratio": round(asset_count / active_count, 4) if active_count else None,\n                "source_url": meta.get("source_url"),\n'
          )
          replace(
              'management_report.py',
              '        store = _load_store()\n        available = sorted(list((store.get("quarters") or {}).keys()), key=_quarter_sort_key, reverse=True)\n        if not base and available:\n',
              '        if base and not _valid_quarter(base):\n            return jsonify({"ok": False, "error": "기준분기 형식이 올바르지 않습니다."}), 400\n        if compare and not _valid_quarter(compare):\n            return jsonify({"ok": False, "error": "비교분기 형식이 올바르지 않습니다."}), 400\n        store = _load_store()\n        available = sorted(list((store.get("quarters") or {}).keys()), key=_quarter_sort_key, reverse=True)\n        if not base and available:\n',
              expected=1
          )
          replace(
              'management_report.py',
              '        if not base or not compare:\n            return jsonify({"ok": False, "error": "비교 가능한 분기 데이터가 아직 없습니다."}), 404\n        payload, error = _comparison_payload(base, compare)\n',
              '        if not base or not compare:\n            return jsonify({"ok": False, "error": "비교 가능한 분기 데이터가 아직 없습니다."}), 404\n        if base == compare:\n            return jsonify({"ok": False, "error": "기준분기와 비교분기는 서로 달라야 합니다."}), 400\n        payload, error = _comparison_payload(base, compare)\n',
              expected=1
          )
          replace(
              'management_report.py',
              '    def management_report_export():\n        base = str(request.args.get("base") or "").strip()\n        compare = str(request.args.get("compare") or "").strip()\n        payload, error = _comparison_payload(base, compare)\n',
              '    def management_report_export():\n        base = str(request.args.get("base") or "").strip()\n        compare = str(request.args.get("compare") or "").strip()\n        if base and not _valid_quarter(base):\n            return jsonify({"ok": False, "error": "기준분기 형식이 올바르지 않습니다."}), 400\n        if compare and not _valid_quarter(compare):\n            return jsonify({"ok": False, "error": "비교분기 형식이 올바르지 않습니다."}), 400\n        store = _load_store()\n        available = sorted(list((store.get("quarters") or {}).keys()), key=_quarter_sort_key, reverse=True)\n        if not base and available:\n            base = available[0]\n        if not compare and len(available) > 1:\n            compare = available[1]\n        if not base or not compare:\n            return jsonify({"ok": False, "error": "비교 가능한 분기 데이터가 아직 없습니다."}), 404\n        if base == compare:\n            return jsonify({"ok": False, "error": "기준분기와 비교분기는 서로 달라야 합니다."}), 400\n        payload, error = _comparison_payload(base, compare)\n'
          )

          # 5) Intelligence core: quarterly ROA/ROE never derived/reused, and all cumulative
          # profitability deltas are blank unless the compared quarters have the same period length.
          replace('management_intelligence.py','INTELLIGENCE_SCHEMA_VERSION = 5','INTELLIGENCE_SCHEMA_VERSION = 7')
          replace(
              'management_intelligence.py',
              '\ndef _normalize_bank(value):\n',
              '\nPROFITABILITY_CUMULATIVE_FIELDS = {\n    "net_income", "operating_profit", "net_interest_income", "interest_income",\n    "interest_expense", "deposit_interest_expense", "time_deposit_interest_expense",\n}\n\n\ndef _normalize_bank(value):\n'
          )
          old_derived='''    # FISIS SE010 exposes the official ROA/ROE accounts but some quarterly\n    # responses leave C/D blank. In that case use the same table's average\n    # assets/equity and cumulative net income to calculate an annualised\n    # quarterly ratio. We mark the fallback so the UI can disclose it.\n    q = _quarter_no(quarter)\n    factor = (4.0 / q) if q else None\n    profit = _number(source.get("profit_net_income"))\n    if profit is None:\n        profit = _number(source.get("net_income"))\n    avg_assets = _number(source.get("avg_assets"))\n    avg_equity = _number(source.get("avg_equity"))\n    if source.get("roa") is None and profit is not None and avg_assets not in (None, 0) and factor:\n        source["roa"] = _round(profit / avg_assets * 100 * factor, 4)\n        source["roa_derived"] = True\n    if source.get("roe") is None and profit is not None and avg_equity not in (None, 0) and factor:\n        source["roe"] = _round(profit / avg_equity * 100 * factor, 4)\n        source["roe_derived"] = True\n    return source\n'''
          new_derived='''    # FISIS savings-bank profitability table SE010 does not support term=Q.\n    # Never resurrect cached SE010 values and never estimate quarterly ROA/ROE.\n    source["roa"] = None\n    source["roe"] = None\n    source.pop("roa_derived", None)\n    source.pop("roe_derived", None)\n    return source\n'''
          replace('management_intelligence.py',old_derived,new_derived)
          replace(
              'management_intelligence.py',
              '        metrics = {field[0]: _metric_pack(base_row, compare_row, yoy_row, field[0]) for field in SECTION_FIELDS[section]}\n        base_rows.append({\n',
              '        metrics = {field[0]: _metric_pack(base_row, compare_row, yoy_row, field[0]) for field in SECTION_FIELDS[section]}\n        if section == "profitability" and _quarter_no(base) != _quarter_no(compare):\n            for metric_key in PROFITABILITY_CUMULATIVE_FIELDS:\n                if metric_key in metrics:\n                    metrics[metric_key]["delta"] = None\n                    metrics[metric_key]["comparable"] = False\n                    metrics[metric_key]["delta_reason"] = "누적기간이 다른 손익 수치는 증감 비교하지 않습니다."\n        base_rows.append({\n'
          )
          replace(
              'management_intelligence.py',
              '    anchor = {"funding": "deposits", "soundness": "liquidity_ratio", "profitability": "roa"}[section]\n',
              '    anchor = {"funding": "deposits", "soundness": "liquidity_ratio", "profitability": "operating_profit"}[section]\n'
          )
          replace(
              'management_intelligence.py',
              '        "bank_count": len(base_rows), "fields": _fields(section), "woori": woori, "rows": base_rows,\n',
              '        "bank_count": len(base_rows), "fields": _fields(section), "woori": woori, "rows": base_rows,\n        "comparison_period_compatible": section != "profitability" or _quarter_no(base) == _quarter_no(compare),\n'
          )
          replace(
              'management_intelligence.py',
              '            "roa_roe_basis": "FISIS 분기 ROA/ROE 원계정이 공란이면 같은 수익성 표의 평균자산·평균자본과 누적 순이익으로 연환산한 참고값을 표시합니다.",\n',
              '            "roa_roe_basis": "FISIS 저축은행 수익성(SE010)은 분기(Q) 조회를 지원하지 않아 ROA·ROE를 추정하지 않고 -로 표시합니다.",\n'
          )

          # The separate store itself is also safe without relying on install-order monkey patches.
          replace('fisis_intelligence_store.py','SCHEMA_VERSION = 6','SCHEMA_VERSION = 7')
          replace(
              'fisis_intelligence_store.py',
              '    "SE010": {\n        "avg_assets": "A", "avg_equity": "B", "roa": "C",\n        "profit_net_income": "C1", "roe": "D",\n    },\n',
              ''
          )
          replace(
              'fisis_intelligence_store.py',
              '# Schema 4 already proved these core tables for all 79 banks.  Schema 6 can\n# therefore migrate by reusing them and querying only the two corrected tables.\nUPGRADE_TABLES = {\n    "SE010": TABLES["SE010"],\n    "SE014": TABLES["SE014"],\n}\n',
              '# Schema 7 removes unsupported quarterly SE010 entirely. Existing proven\n# rows can migrate without additional FISIS table calls.\nUPGRADE_TABLES = {}\n'
          )
          replace(
              'fisis_intelligence_store.py',
              'def _normalize_seed_row(row):\n    result = dict(row or {})\n    for metric in AMOUNT_METRICS:\n',
              'def _normalize_seed_row(row):\n    result = dict(row or {})\n    for unsupported in ("avg_assets", "avg_equity", "profit_net_income", "roa", "roe"):\n        result.pop(unsupported, None)\n    for metric in AMOUNT_METRICS:\n'
          )

          # 6) Base report UI: cumulative net income uses YoY, not previous year-end;
          # arbitrary comparison shows '기간상이', and external bank text is escaped.
          replace(
              'static/js/management_report.js',
              "  const yearEndDeltaFields = new Set(['total_assets','total_loans','net_income']);\n",
              "  const yearEndDeltaFields = new Set(['total_assets','total_loans']);\n  const yoyDeltaFields = new Set(['net_income']);\n"
          )
          replace(
              'static/js/management_report.js',
              "  function previousYearEndQuarter(key) {\n    const parts = quarterParts(key);\n    return parts ? `${parts.year - 1}Q4` : '';\n  }\n",
              "  function previousYearEndQuarter(key) {\n    const parts = quarterParts(key);\n    return parts ? `${parts.year - 1}Q4` : '';\n  }\n\n  function previousYearSameQuarter(key) {\n    const parts = quarterParts(key);\n    return parts ? `${parts.year - 1}Q${parts.quarter}` : '';\n  }\n"
          )
          replace(
              'static/js/management_report.js',
              "    const yearEndKeyCandidate = previousYearEndQuarter(selected);\n    const prevKey = hasQuarter(prevKeyCandidate) ? prevKeyCandidate : '';\n    const yearEndKey = hasQuarter(yearEndKeyCandidate) ? yearEndKeyCandidate : '';\n    const primaryCompare = prevKey || yearEndKey || anyOtherQuarter(selected);\n",
              "    const yearEndKeyCandidate = previousYearEndQuarter(selected);\n    const yoyKeyCandidate = previousYearSameQuarter(selected);\n    const prevKey = hasQuarter(prevKeyCandidate) ? prevKeyCandidate : '';\n    const yearEndKey = hasQuarter(yearEndKeyCandidate) ? yearEndKeyCandidate : '';\n    const yoyKey = hasQuarter(yoyKeyCandidate) ? yoyKeyCandidate : '';\n    const primaryCompare = prevKey || yearEndKey || yoyKey || anyOtherQuarter(selected);\n"
          )
          replace(
              'static/js/management_report.js',
              '      let prevData = null;\n      let yearEndData = null;\n',
              '      let prevData = null;\n      let yearEndData = null;\n      let yoyData = null;\n'
          )
          replace(
              'static/js/management_report.js',
              "      if (yearEndKey) {\n        if (primaryCompare === yearEndKey) yearEndData = currentData;\n        else if (prevKey === yearEndKey && prevData) yearEndData = prevData;\n        else yearEndData = await fetchJson(`/api/management-report?base=${encodeURIComponent(selected)}&compare=${encodeURIComponent(yearEndKey)}`);\n      }\n\n      state.payload = currentData;\n      renderSingleSummary(currentData, prevData, yearEndData);\n      renderSingleTable(currentData, prevData, yearEndData);\n",
              "      if (yearEndKey) {\n        if (primaryCompare === yearEndKey) yearEndData = currentData;\n        else if (prevKey === yearEndKey && prevData) yearEndData = prevData;\n        else yearEndData = await fetchJson(`/api/management-report?base=${encodeURIComponent(selected)}&compare=${encodeURIComponent(yearEndKey)}`);\n      }\n\n      if (yoyKey) {\n        if (primaryCompare === yoyKey) yoyData = currentData;\n        else if (prevKey === yoyKey && prevData) yoyData = prevData;\n        else if (yearEndKey === yoyKey && yearEndData) yoyData = yearEndData;\n        else yoyData = await fetchJson(`/api/management-report?base=${encodeURIComponent(selected)}&compare=${encodeURIComponent(yoyKey)}`);\n      }\n\n      state.payload = currentData;\n      renderSingleSummary(currentData, prevData, yearEndData, yoyData);\n      renderSingleTable(currentData, prevData, yearEndData, yoyData);\n"
          )
          replace(
              'static/js/management_report.js',
              '  function renderSingleSummary(data, prevData, yearEndData) {\n',
              '  function renderSingleSummary(data, prevData, yearEndData, yoyData) {\n'
          )
          replace(
              'static/js/management_report.js',
              '    const prevW = prevData?.woori || null;\n    const yearW = yearEndData?.woori || null;\n    const m = w.metrics || {};\n    const pm = prevW?.metrics || {};\n    const ym = yearW?.metrics || {};\n',
              '    const prevW = prevData?.woori || null;\n    const yearW = yearEndData?.woori || null;\n    const yoyW = yoyData?.woori || null;\n    const m = w.metrics || {};\n    const pm = prevW?.metrics || {};\n    const ym = yearW?.metrics || {};\n    const yoym = yoyW?.metrics || {};\n'
          )
          replace(
              'static/js/management_report.js',
              "        yearW ? compareNote('전년말比', ym.net_income?.delta, 'net_income') : '전년말比 -'\n",
              "        yoyW ? compareNote('전년동기比', yoym.net_income?.delta, 'net_income') : '전년동기比 -'\n"
          )
          replace(
              'static/js/management_report.js',
              '  function renderSingleTable(data, prevData, yearEndData) {\n',
              '  function renderSingleTable(data, prevData, yearEndData, yoyData) {\n'
          )
          replace(
              'static/js/management_report.js',
              '    const prevRows = rowMap(prevData);\n    const yearRows = rowMap(yearEndData);\n',
              '    const prevRows = rowMap(prevData);\n    const yearRows = rowMap(yearEndData);\n    const yoyRows = rowMap(yoyData);\n'
          )
          replace(
              'static/js/management_report.js',
