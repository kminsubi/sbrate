name: Diagnose Peer Names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose_peer_names.yml'
  workflow_dispatch:

jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: Print live management bank names
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://sbrate.onrender.com/api/management-report?base=2026Q1&compare=2025Q4'
          req=urllib.request.Request(url,headers={'User-Agent':'SBRate-Peer-Diagnostic/1.0'})
          with urllib.request.urlopen(req,timeout=120) as r:
              data=json.loads(r.read().decode('utf-8'))
          names=[str(x.get('bank') or '') for x in data.get('rows') or []]
          print('BANK_NAMES_START')
          for n in names: print(n)
          print('BANK_NAMES_END')
          print('KB_LIKE', [n for n in names if any(t in n.lower() for t in ('kb','케이','국민'))])
          PY
