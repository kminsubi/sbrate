name: SBRate V5.38 Mobile Wibee Lower

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v538_mobile_wibee_lower.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v538_mobile_wibee_lower.py

      - name: Validate
        run: |
          grep -q 'SBRate V5.38 MOBILE WIBEE LOWER FOR ISA / IRP' static/css/v513-mobile-hero-hotfix.css
          grep -q 'v513-mobile-hero-hotfix.css?v=20260815v538' templates/mobile.html
          git diff --check

      - name: Commit and clean
        run: |
          rm -f .github/workflows/v538_mobile_wibee_lower.yml
          rm -f .github/v538_mobile_wibee_lower.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Lower ISA and IRP mobile Wibee group'
          git push origin main
