name: Apply Management FISIS Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/patch_management_fisis.py"
      - ".github/workflows/apply_management_fisis_patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply patch
        run: python .github/patch_management_fisis.py

      - name: Validate
        run: |
          python -m py_compile fisis_management.py management_report.py scheduler.py
          node --check static/js/management_report.js
          git diff --check

      - name: Remove one-shot files and commit
        run: |
          rm -f .github/patch_management_fisis.py .github/workflows/apply_management_fisis_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Switch management report to FISIS"
          git pull --rebase origin main
          git push origin main
