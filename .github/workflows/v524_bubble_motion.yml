name: SBRate V5.24 Bubble Motion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v524_bubble_motion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/v524_bubble_motion_patch.py

      - name: Validate
        run: |
          grep -q 'SBRate V5.24 PC BUBBLE MOTION' static/css/dashboard.css
          grep -q 'sb-v524-pc-bubble' static/css/dashboard.css
          grep -q 'SBRate V5.24 MOBILE BUBBLE POSITION' static/css/v513-mobile-hero-hotfix.css
          grep -q 'left:96px' static/css/v513-mobile-hero-hotfix.css
          grep -q 'dashboard.css?v=20260815v524' templates/index.html
          grep -q 'v513-mobile-hero-hotfix.css?v=20260815v524' templates/mobile.html
          git diff --check

      - name: Commit and clean
        run: |
          rm -f .github/v524_bubble_motion_patch.py .github/workflows/v524_bubble_motion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/css/dashboard.css static/css/v513-mobile-hero-hotfix.css templates/index.html templates/mobile.html .github/v524_bubble_motion_patch.py .github/workflows/v524_bubble_motion.yml
          git commit -m 'Animate PC briefing bubble and shift mobile bubble right'
          git push origin main